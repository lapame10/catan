<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catan</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2233">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --mar:#0f2233;          /* el mar, de fondo */
    --mar2:#16324a;
    --txt:#f2f6fa;
    --dim:#93a9be;
    --oro:#e8b73c;
    --madera:#3a2a1c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--mar);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}

  header{display:flex;align-items:center;gap:11px;padding:13px 18px 11px}
  header .logo{width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    background:radial-gradient(circle at 30% 25%,#f5cd63,#d9992a);display:flex;align-items:center;
    justify-content:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.4px}
  header .sub{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.2px}

  /* ===== TABLERO ===== */
  .mapa{width:100%;max-width:452px;margin:0 auto;display:block;padding:0 10px}
  .hex{cursor:pointer}
  .hex:active{filter:brightness(1.1)}
  .hex .tierra{stroke:#0b1a27;stroke-width:2.2;stroke-linejoin:round}
  .hex .borde{fill:none;stroke:rgba(255,255,255,.07);stroke-width:1.1}

  /* la ficha del numero */
  .ficha circle{fill:#f7f2e6;stroke:#0b1a27;stroke-width:1.8}
  .ficha text{font-family:-apple-system,sans-serif;font-weight:800;font-size:20px;fill:#1d2b38;
    text-anchor:middle;dominant-baseline:central;pointer-events:none;letter-spacing:-.5px}
  .ficha.alto text{fill:#b02a20}
  .ficha .pip{fill:#8a7a58}

  .dibujo{pointer-events:none}

  /* ===== BOTONES ===== */
  .pie{max-width:452px;margin:6px auto 0;padding:0 18px}
  .fila{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:800;font-family:inherit;
    cursor:pointer;color:#241a0d;background:linear-gradient(180deg,#f0c353,#dda42e);
    box-shadow:0 2px 0 rgba(0,0,0,.28);transition:transform .08s}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
  .btn.alt{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid rgba(255,255,255,.16);box-shadow:none}

  /* ===== DADOS ===== */
  #dados{display:flex;gap:16px;justify-content:center;margin:16px 0 6px}
  .dado{width:60px;height:60px;background:linear-gradient(150deg,#fdfaf3,#e8dfc9);border-radius:13px;
    position:relative;box-shadow:0 4px 0 rgba(0,0,0,.32),inset 0 -2px 6px rgba(0,0,0,.09)}
  .dado.tirando{animation:gira .5s cubic-bezier(.3,.8,.4,1)}
  @keyframes gira{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.13)}100%{transform:rotate(360deg) scale(1)}}
  .punto{position:absolute;width:11px;height:11px;border-radius:50%;background:#2b3542;box-shadow:inset 0 -1px 2px rgba(0,0,0,.4)}
  .punto.tl{left:12px;top:12px}.punto.tr{right:12px;top:12px}
  .punto.ml{left:12px;top:50%;transform:translateY(-50%)}.punto.mr{right:12px;top:50%;transform:translateY(-50%)}
  .punto.bl{left:12px;bottom:12px}.punto.br{right:12px;bottom:12px}
  .punto.mc{left:50%;top:50%;transform:translate(-50%,-50%)}
  #total{text-align:center;font-size:12.5px;color:var(--dim);margin-top:8px;min-height:19px;font-weight:600;letter-spacing:.2px}
  #total b{color:var(--oro);font-size:18px;font-weight:800}

  /* ===== DETALLE DE UNA FICHA ===== */
  #detalle{max-width:452px;margin:14px auto 0;padding:0 18px;display:none}
  #detalle.show{display:block}
  .carta{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:13px}
  .carta .min{width:44px;height:44px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .carta .cn{font-weight:800;font-size:14.5px}
  .carta .cs{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.45}
  .carta .cs b{color:var(--oro)}
</style>
</head>
<body>

<header>
  <div class="logo">🎲</div>
  <div>
    <h1>Catan</h1>
    <div class="sub" id="estado">19 fichas · 3-4-5-4-3</div>
  </div>
</header>

<div class="mapa"><svg id="tablero" viewBox="0 0 456 480"></svg></div>

<div class="pie">
  <div class="fila">
    <button class="btn" id="tirar">🎲 Tirar los dados</button>
    <button class="btn alt" id="nuevo">Nuevo tablero</button>
  </div>
  <div id="dados"></div>
  <div id="total">Toca "Tirar los dados"</div>
</div>

<div id="detalle"><div class="carta" id="carta"></div></div>

<script>
/* ============================================================================
   TABLERO DE CATAN — geometria CORRECTA

   Hexagonos "flat-top" (con lados horizontales arriba y abajo, como las fichas
   reales). En esta orientacion NO se acomodan por filas: se acomodan por
   COLUMNAS, y las columnas van desfasadas media ficha. Es la forma en que encajan
   sin dejar huecos, como un panal.

     columnas:  3  4  5  4  3      (izquierda a derecha)
     paso entre columnas:  1.5 R
     paso dentro de una columna:  raiz(3) R
     columnas vecinas: desfasadas raiz(3) R / 2

   El desfase sale SOLO al centrar cada columna, asi que no hay que calcularlo.
   ============================================================================ */

const R = 46;                       // radio (del centro a un vertice)
const RX = 1.5 * R;                 // paso horizontal entre columnas
const RY = Math.sqrt(3) * R;        // paso vertical dentro de una columna

const RECS = {
  bosque  : {n:'Bosque',   da:'madera',   base:'#33705a', luz:'#42826a', tinta:'#173d31'},
  pasto   : {n:'Pasto',    da:'lana',     base:'#a8bc55', luz:'#bccd6c', tinta:'#586b21'},
  trigo   : {n:'Trigo',    da:'trigo',    base:'#cfa73f', luz:'#ddb954', tinta:'#7a611d'},
  ladrillo: {n:'Ladrillo', da:'ladrillo', base:'#b0573a', luz:'#c26a4b', tinta:'#6b2f1c'},
  mineral : {n:'Mineral',  da:'mineral',  base:'#8a939c', luz:'#9ba4ad', tinta:'#4b545c'},
  desierto: {n:'Desierto', da:null,       base:'#d9c9a0', luz:'#e4d7b5', tinta:'#8a7a55'},
};

const MAZO = [
  ...Array(4).fill('bosque'), ...Array(4).fill('pasto'), ...Array(4).fill('trigo'),
  ...Array(3).fill('ladrillo'), ...Array(3).fill('mineral'), 'desierto',
];
const NUMS = [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
const COLS = [3,4,5,4,3];

const CX = 228, CY = 240;

function revuelve(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

/* ===== LOS DIBUJOS (SVG, dibujados a mano, no emojis) =====
   Cada uno se dibuja en una caja de 60x60 y luego se escala y se centra.
   Un solo color de tinta por recurso: se ven limpios y parejos. */
const DIBUJOS = {
  /* Cada dibujo usa VARIOS colores (no una sola tinta) para que se vean
     caricaturescos y alegres en vez de siluetas planas. */
  bosque: () => `
    <rect x="12" y="40" width="5" height="12" rx="2" fill="#6b4326"/>
    <rect x="27" y="38" width="5.5" height="14" rx="2.6" fill="#6b4326"/>
    <rect x="42" y="41" width="4.6" height="11" rx="2.2" fill="#6b4326"/>
    <circle cx="14.5" cy="33" r="11" fill="#245c46"/>
    <circle cx="9" cy="38" r="8" fill="#2d6b52"/>
    <circle cx="20" cy="38" r="8" fill="#2d6b52"/>
    <circle cx="29.5" cy="28" r="15" fill="#245c46"/>
    <circle cx="22" cy="35" r="10" fill="#2d6b52"/>
    <circle cx="37" cy="35" r="10" fill="#2d6b52"/>
    <circle cx="44" cy="34" r="9" fill="#245c46"/>
    <circle cx="40" cy="39" r="7" fill="#2d6b52"/>`,
  pasto: () => `
    <ellipse cx="27" cy="34" rx="19" ry="13" fill="#f6f2e6"/>
    <circle cx="17" cy="27" r="8" fill="#fbf8f0"/>
    <circle cx="27" cy="23" r="9" fill="#fbf8f0"/>
    <circle cx="37" cy="27" r="8" fill="#fbf8f0"/>
    <circle cx="20" cy="39" r="8" fill="#eae4d2"/>
    <circle cx="33" cy="39" r="8" fill="#eae4d2"/>
    <circle cx="45" cy="30" r="8.5" fill="#4a3d33"/>
    <ellipse cx="50" cy="24" rx="5" ry="3" transform="rotate(22 50 24)" fill="#4a3d33"/>
    <circle cx="47" cy="29" r="1.7" fill="#fff"/>
    <circle cx="47.4" cy="29" r="0.9" fill="#1d1712"/>
    <rect x="17" y="43" width="3.4" height="11" rx="1.7" fill="#4a3d33"/>
    <rect x="25" y="44" width="3.4" height="11" rx="1.7" fill="#4a3d33"/>
    <rect x="33" y="43" width="3.4" height="11" rx="1.7" fill="#4a3d33"/>`,
  trigo: () => `
    <rect x="27.6" y="26" width="4.8" height="29" rx="2.4" fill="#8a6a1e"/>
    <g fill="#e8c65a">
      <ellipse cx="21" cy="20" rx="6" ry="4" transform="rotate(-35 21 20)"/>
      <ellipse cx="39" cy="20" rx="6" ry="4" transform="rotate(35 39 20)"/>
      <ellipse cx="20" cy="31" rx="6" ry="4" transform="rotate(-35 20 31)"/>
      <ellipse cx="40" cy="31" rx="6" ry="4" transform="rotate(35 40 31)"/>
      <ellipse cx="21" cy="42" rx="6" ry="4" transform="rotate(-35 21 42)"/>
      <ellipse cx="39" cy="42" rx="6" ry="4" transform="rotate(35 39 42)"/>
    </g>
    <ellipse cx="30" cy="13" rx="5" ry="8" fill="#f2d878"/>
    <path d="M26 8 q4 -6 8 -1" stroke="#8a6a1e" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  ladrillo: () => `
    <g fill="#c96a48">
      <rect x="8" y="18" width="20" height="11" rx="2.4"/>
      <rect x="32" y="18" width="20" height="11" rx="2.4"/>
      <rect x="20" y="32" width="20" height="11" rx="2.4"/>
      <rect x="8" y="46" width="20" height="9" rx="2.4"/>
      <rect x="32" y="46" width="20" height="9" rx="2.4"/>
    </g>
    <g fill="#a04a2c">
      <rect x="8" y="27" width="20" height="2" rx="1"/>
      <rect x="32" y="27" width="20" height="2" rx="1"/>
      <rect x="20" y="41" width="20" height="2" rx="1"/>
    </g>`,
  mineral: () => `
    <path d="M2 48 L20 14 L38 48 Z" fill="#6d777f"/>
    <path d="M20 14 L26 27 L14 27 Z" fill="#f2f6fa"/>
    <path d="M20 14 L20 48" stroke="#4b545c" stroke-width="1.6" opacity=".55"/>
    <path d="M26 48 L42 22 L58 48 Z" fill="#8a939c"/>
    <path d="M42 22 L46 32 L38 32 Z" fill="#f2f6fa"/>
    <path d="M42 22 L42 48" stroke="#4b545c" stroke-width="1.6" opacity=".45"/>
    <circle cx="14" cy="40" r="2.4" fill="#e8c65a"/>
    <circle cx="50" cy="41" r="2" fill="#e8c65a"/>`,
  desierto: () => `
    <circle cx="42" cy="16" r="8" fill="#f0c14b"/>
    <g stroke="#f0c14b" stroke-width="2.2" stroke-linecap="round">
      <path d="M42 3 L42 6"/><path d="M53 16 L56 16"/><path d="M50 7 L52 5"/><path d="M34 7 L32 5"/>
    </g>
    <path d="M2 45 q13 -15 26 0 q13 -15 26 0 Z" fill="#c2ab74"/>
    <path d="M2 45 q13 -15 26 0" stroke="#b09a63" stroke-width="1.5" fill="none"/>
    <rect x="12" y="28" width="5.6" height="18" rx="2.8" fill="#4f8f5a"/>
    <rect x="4" y="31" width="4.6" height="8" rx="2.3" fill="#4f8f5a"/>
    <rect x="4" y="31" width="12" height="4.6" rx="2.3" fill="#4f8f5a"/>
    <rect x="6" y="24" width="4.6" height="8" rx="2.3" fill="#4f8f5a"/>
    <rect x="6" y="24" width="10" height="4.6" rx="2.3" fill="#4f8f5a"/>
    <circle cx="15" cy="26" r="3" fill="#e8607a"/>`,
};


function verts(cx, cy){
  const p = [];
  for (let i = 0; i < 6; i++){
    const a = (Math.PI / 180) * (60 * i);
    p.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  return p;
}
function path(cx, cy){
  return verts(cx, cy).map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ') + ' Z';
}
/* el mismo hexagono pero encogido un poco: para el borde interior, da sensacion
   de ficha con relieve en vez de color plano */
function pathIn(cx, cy, k){
  const rr = R * k;
  const p = [];
  for (let i = 0; i < 6; i++){
    const a = (Math.PI / 180) * (60 * i);
    p.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
  }
  return p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ') + ' Z';
}

let layout = [];

function construye(){
  const mazo = revuelve(MAZO);
  const nums = revuelve(NUMS);
  layout = [];
  let k = 0, ni = 0;

  COLS.forEach((cuantos, c) => {
    const cx = CX + (c - 2) * RX;
    const alto = (cuantos - 1) * RY;
    const y0 = CY - alto / 2;
    for (let i = 0; i < cuantos; i++){
      const rec = mazo[k++];
      layout.push({
        cx, cy: y0 + i * RY, rec,
        num: rec === 'desierto' ? null : nums[ni++],
        id: 'c' + c + '_' + i
      });
    }
  });
}

function pinta(){
  const svg = document.getElementById('tablero');
  let h = '';

  // el mar, con un degradado suave
  h += '<defs><radialGradient id="mar" cx="50%" cy="42%" r="72%">' +
       '<stop offset="0%" stop-color="#1a3a55"/><stop offset="100%" stop-color="#0d1e2d"/></radialGradient></defs>';
  h += '<rect x="0" y="0" width="456" height="480" fill="url(#mar)"/>';

  layout.forEach(hex => {
    const info = RECS[hex.rec];
    h += '<g class="hex" data-id="' + hex.id + '">';
    h += '<path class="tierra" d="' + path(hex.cx, hex.cy) + '" fill="' + info.base + '"/>';
    // relieve: un hexagono interior mas claro
    h += '<path d="' + pathIn(hex.cx, hex.cy, 0.86) + '" fill="' + info.luz + '" opacity=".5"/>';

    // el dibujo del recurso
    const esc = (hex.rec === 'desierto') ? 1.02 : 0.86;
    const tx = hex.cx - 30 * esc;
    const ty = hex.cy - 30 * esc - (hex.num ? 7 : 0);
    h += '<g class="dibujo" transform="translate(' + tx.toFixed(1) + ',' + ty.toFixed(1) + ') scale(' + esc + ')">';
    h += DIBUJOS[hex.rec]();
    h += '</g>';

    // la ficha del numero
    if (hex.num){
      const alto = (hex.num === 6 || hex.num === 8) ? ' alto' : '';
      const cy2 = hex.cy + 19;
      h += '<g class="ficha' + alto + '">';
      h += '<circle cx="' + hex.cx + '" cy="' + cy2 + '" r="16.5"/>';
      h += '<text x="' + hex.cx + '" y="' + (cy2 + 0.5) + '">' + hex.num + '</text>';
      const pips = PIPS[hex.num];
      const sep = 4.1;
      const x0 = hex.cx - ((pips - 1) * sep) / 2;
      for (let i = 0; i < pips; i++){
        h += '<circle class="pip" cx="' + (x0 + i * sep).toFixed(1) + '" cy="' + (cy2 + 10.5) + '" r="1.4"/>';
      }
      h += '</g>';
    }
    h += '</g>';
  });

  svg.innerHTML = h;
  svg.querySelectorAll('.hex').forEach(g => g.addEventListener('click', () => muestra(g.getAttribute('data-id'))));
}

function muestra(id){
  const hex = layout.find(x => x.id === id);
  if (!hex) return;
  const info = RECS[hex.rec];
  const prob = hex.num ? (PIPS[hex.num] / 36 * 100).toFixed(1) : null;
  document.getElementById('carta').innerHTML =
    '<div class="min" style="background:' + info.base + '">' +
      '<svg width="30" height="30" viewBox="0 0 60 60">' + DIBUJOS[hex.rec]() + '</svg>' +
    '</div>' +
    '<div><div class="cn">' + info.n + (hex.num ? ' · ' + hex.num : '') + '</div>' +
    '<div class="cs">' +
      (info.da ? 'Da <b>' + info.da + '</b>' : 'Aquí no se produce — <b>empieza el ladrón</b> 🥷') +
      (prob ? ' · sale <b>' + prob + '%</b> de las veces' : '') +
    '</div></div>';
  document.getElementById('detalle').classList.add('show');
}

/* ===== DADOS ===== */
const CARAS = [[], ['mc'], ['tl','br'], ['tl','mc','br'], ['tl','tr','bl','br'],
               ['tl','tr','mc','bl','br'], ['tl','tr','ml','mr','bl','br']];
const cara = n => CARAS[n].map(p => '<span class="punto ' + p + '"></span>').join('');

function pintaDados(a, b){
  document.getElementById('dados').innerHTML =
    '<div class="dado" id="d1">' + cara(a) + '</div><div class="dado" id="d2">' + cara(b) + '</div>';
}
function tirar(){
  const d = document.getElementById('dados');
  d.querySelectorAll('.dado').forEach(x => { x.classList.remove('tirando'); void x.offsetWidth; x.classList.add('tirando'); });
  document.getElementById('total').innerHTML = '…';
  setTimeout(() => {
    const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
    pintaDados(a, b);
    const t = a + b;
    document.getElementById('total').innerHTML = 'Salio <b>' + t + '</b>' +
      (t === 7 ? ' — ¡sale el ladrón! 🥷' : (t === 12 ? ' — ¡jackpot! 🎉' : ''));
  }, 500);
}

document.getElementById('tirar').onclick = tirar;
document.getElementById('nuevo').onclick = () => {
  construye(); pinta();
  document.getElementById('detalle').classList.remove('show');
  pintaDados(1, 1);
  document.getElementById('total').textContent = 'Tablero nuevo 🎲';
};

construye(); pinta(); pintaDados(1, 1);
</script>
</body>
</html>
