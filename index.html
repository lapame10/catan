<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catan</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b3a5c">
<style>
  :root{
    --bg:#12263a;
    --bg2:#0d1c2b;
    --panel:#1b3a5c;
    --line:rgba(255,255,255,.14);
    --txt:#eaf2fb;
    --dim:#8fa8c2;
    --oro:#f0b429;
    --acento:#38bdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}

  header{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  header .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#f0b429,#e07b1a);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  header h1{font-size:16px;margin:0;font-weight:800;letter-spacing:.3px}
  header .sub{font-size:10.5px;color:var(--dim);margin-top:1px}

  /* ===== TABLERO ===== */
  #tablero{width:100%;max-width:440px;margin:10px auto 0;display:block;padding:0 8px}
  .hex{cursor:pointer;transition:filter .15s}
  .hex:active{filter:brightness(1.15)}
  .hex path{stroke:#0d1c2b;stroke-width:2.5;stroke-linejoin:round}
  .hex .num circle{fill:#f6f1e4;stroke:#0d1c2b;stroke-width:1.5}
  .hex .num text{font-family:-apple-system,sans-serif;font-weight:800;font-size:19px;fill:#1a2b3c;
    text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .hex .num .pipn{font-size:7px;fill:#7a6a4a;font-weight:700;letter-spacing:.5px}
  .hex .num.hot text{fill:#b3261e}
  .hex .ico{font-size:22px;text-anchor:middle;dominant-baseline:central;pointer-events:none;opacity:.85}
  .hex.desierto .ico{font-size:26px}

  /* ===== PIE ===== */
  .pie{max-width:440px;margin:8px auto 0;padding:0 16px}
  .fila{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .btn{border:none;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:800;
    font-family:inherit;cursor:pointer;color:#10202f;background:var(--oro)}
  .btn:active{opacity:.85}
  .btn.alt{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
  .nota{text-align:center;font-size:11px;color:var(--dim);margin-top:10px;line-height:1.5}

  /* ===== DADOS ===== */
  #dados{display:flex;gap:14px;justify-content:center;margin:14px 0 4px}
  .dado{width:58px;height:58px;background:#f6f1e4;border-radius:12px;position:relative;
    box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .1s}
  .dado.tirando{animation:gira .45s ease-in-out}
  @keyframes gira{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}100%{transform:rotate(360deg) scale(1)}}
  .punto{position:absolute;width:11px;height:11px;border-radius:50%;background:#1a2b3c}
  .punto.tl{left:11px;top:11px}.punto.tr{right:11px;top:11px}
  .punto.ml{left:11px;top:50%;transform:translateY(-50%)}.punto.mr{right:11px;top:50%;transform:translateY(-50%)}
  .punto.bl{left:11px;bottom:11px}.punto.br{right:11px;bottom:11px}
  .punto.mc{left:50%;top:50%;transform:translate(-50%,-50%)}
  #total{text-align:center;font-size:13px;color:var(--dim);margin-top:6px;min-height:18px;font-weight:700}
  #total b{color:var(--oro);font-size:17px}

  /* ===== HOJA DE RECURSOS ===== */
  #detalle{max-width:440px;margin:10px auto 0;padding:0 16px;display:none}
  #detalle.show{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 15px;
    display:flex;align-items:center;gap:12px}
  .card .cico{font-size:30px;flex:0 0 auto}
  .card .cnom{font-weight:800;font-size:15px}
  .card .csub{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
  .card .csub b{color:var(--oro)}

  /* Aviso de que esto es solo el tablero */
  .aviso{max-width:440px;margin:16px auto 0;padding:0 16px}
  .aviso .in{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.35);border-radius:12px;
    padding:12px 14px;font-size:12px;line-height:1.55;color:#cfe6f8}
  .aviso b{color:var(--acento)}
</style>
</head>
<body>

<header>
  <div class="logo">🎲</div>
  <div>
    <h1>Catan</h1>
    <div class="sub" id="estado">Tablero — 19 hexágonos</div>
  </div>
</header>

<!-- el tablero -->
<svg id="tablero" viewBox="0 0 460 470" aria-label="Tablero de Catan"></svg>

<div class="pie">
  <div class="fila">
    <button class="btn" id="tirar">🎲 Tirar los dados</button>
    <button class="btn alt" id="nuevo">Nuevo tablero</button>
  </div>
  <div id="dados" style="margin-top:14px"></div>
  <div id="total">Toca "Tirar los dados"</div>
</div>

<div id="detalle"><div class="card" id="carta"></div></div>

<div class="aviso"><div class="in">
  <b>Esto es la primera parte:</b> el tablero con sus recursos y números, y los dados.<br>
  Lo que sigue: la sala para compartir el link, los jugadores de 2 a 6, y las piezas (poblados y caminos).
</div></div>

<script>
/* ============================================================================
   TABLERO DE CATAN — 19 hexágonos (filas de 3 4 5 4 3)

   Recursos reales del juego:
     4 bosque (madera) · 4 pasto (lana) · 4 trigo · 3 ladrillo · 3 mineral · 1 desierto
   Números reales:
     2, 3, 3, 4, 4, 5, 5, 6, 6, 8, 8, 9, 9, 10, 10, 11, 11, 12  (+ el desierto sin número)

   Las fichas se reparten al azar en cada partida (como en el juego real).
   ============================================================================ */

const RECURSOS = {
  bosque:   {n:'Bosque',    ico:'🌲', color:'#1f6b3a', da:'madera'},
  pasto:    {n:'Pasto',     ico:'🐑', color:'#63a832', da:'lana'},
  trigo:    {n:'Trigo',     ico:'🌾', color:'#d9a521', da:'trigo'},
  ladrillo: {n:'Ladrillo',  ico:'🧱', color:'#b5482e', da:'ladrillo'},
  mineral:  {n:'Mineral',   ico:'⛰️', color:'#7b8794', da:'mineral'},
  desierto: {n:'Desierto',  ico:'🏜️', color:'#ddd0a8', da:null},
};

// cuántas fichas de cada uno (39 recursos + 1 desierto no: son 18 con numero + desierto)
const MAZO = [
  ...Array(4).fill('bosque'),
  ...Array(4).fill('pasto'),
  ...Array(4).fill('trigo'),
  ...Array(3).fill('ladrillo'),
  ...Array(3).fill('mineral'),
  'desierto',
];

// los números que van en las fichas (el desierto no lleva)
const NUMEROS = [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];

// probabilidad de cada número (para pintar los puntitos como en el juego real)
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};

// filas: 3, 4, 5, 4, 3
const FILAS = [3,4,5,4,3];

const R = 48;                       // radio del hexágono
const HW = R;                       // ancho medio (lado a lado vertical)
const HH = Math.sqrt(3) * R / 2;    // altura del centro al vértice de arriba/abajo
const W  = 2 * R;                   // ancho total
const H  = Math.sqrt(3) * R;        // alto total
const CX = 230, CY = 236;           // centro del tablero

function revuelve(a){
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Vértices de un hexágono "flat-top" (lados horizontales arriba y abajo), que es
   como son las fichas de Catan. */
function hexPath(cx, cy){
  const p = [];
  for (let i = 0; i < 6; i++) {
    const ang = (Math.PI / 180) * (60 * i);
    p.push([cx + R * Math.cos(ang), cy + R * Math.sin(ang)]);
  }
  return p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ') + ' Z';
}

let layout = [];   // guarda cada hexagono: {cx, cy, rec, num, id}

function construye(){
  const mazo = revuelve(MAZO);
  const nums = revuelve(NUMEROS);
  layout = [];
  let k = 0, ni = 0;

  FILAS.forEach((cuantos, f) => {
    const dx = W * 0.75;                       // separacion horizontal entre columnas
    const ancho = (cuantos - 1) * dx;
    const x0 = CX - ancho / 2;
    const y = CY + (f - 2) * H;

    for (let i = 0; i < cuantos; i++) {
      const cx = x0 + i * dx;
      const rec = mazo[k++];
      const num = rec === 'desierto' ? null : nums[ni++];
      layout.push({ cx, cy: y, rec, num, id: 'h' + f + '_' + i });
    }
  });
}

function pinta(){
  const svg = document.getElementById('tablero');
  let h = '';

  // el mar
  h += '<rect x="0" y="0" width="460" height="470" fill="#1b4a6b" rx="0"/>';

  layout.forEach(hex => {
    const info = RECURSOS[hex.rec];
    h += '<g class="hex' + (hex.rec === 'desierto' ? ' desierto' : '') + '" data-id="' + hex.id + '">';
    h += '<path d="' + hexPath(hex.cx, hex.cy) + '" fill="' + info.color + '"/>';

    // el icono del recurso, un poco arriba
    h += '<text class="ico" x="' + hex.cx + '" y="' + (hex.cy - (hex.num ? 9 : 0)) + '">' + info.ico + '</text>';

    if (hex.num){
      const hot = (hex.num === 6 || hex.num === 8) ? ' hot' : '';
      h += '<g class="num' + hot + '">';
      h += '<circle cx="' + hex.cx + '" cy="' + (hex.cy + 15) + '" r="17"/>';
      h += '<text x="' + hex.cx + '" y="' + (hex.cy + 15) + '">' + hex.num + '</text>';
      // los puntitos de probabilidad
      const pips = PIPS[hex.num];
      let px = hex.cx - ((pips - 1) * 4.2) / 2;
      for (let i = 0; i < pips; i++){
        h += '<circle cx="' + (px + i * 4.2).toFixed(1) + '" cy="' + (hex.cy + 27) + '" r="1.5" fill="#7a6a4a"/>';
      }
      h += '</g>';
    }
    h += '</g>';
  });

  svg.innerHTML = h;

  // tocar una ficha muestra que da
  svg.querySelectorAll('.hex').forEach(g => {
    g.addEventListener('click', () => muestra(g.getAttribute('data-id')));
  });
}

function muestra(id){
  const hex = layout.find(x => x.id === id);
  if (!hex) return;
  const info = RECURSOS[hex.rec];
  const box = document.getElementById('detalle');
  const c = document.getElementById('carta');
  const prob = hex.num ? (PIPS[hex.num] / 36 * 100).toFixed(1) : null;

  c.innerHTML =
    '<div class="cico">' + info.ico + '</div>' +
    '<div>' +
      '<div class="cnom">' + info.n + (hex.num ? ' · ' + hex.num : '') + '</div>' +
      '<div class="csub">' +
        (info.da ? 'Da <b>' + info.da + '</b>' : 'Aquí no se produce nada — <b>empieza el ladrón</b>') +
        (prob ? ' · sale <b>' + prob + '%</b> de las veces' : '') +
      '</div>' +
    '</div>';
  box.classList.add('show');
}

/* ===== DADOS ===== */
const CARAS = [
  [],                                  // 0
  ['mc'],                              // 1
  ['tl','br'],                         // 2
  ['tl','mc','br'],                    // 3
  ['tl','tr','bl','br'],               // 4
  ['tl','tr','mc','bl','br'],          // 5
  ['tl','tr','ml','mr','bl','br'],     // 6
];

function cara(n){
  let h = '';
  CARAS[n].forEach(p => { h += '<span class="punto ' + p + '"></span>'; });
  return h;
}

function pintaDados(a, b){
  const d = document.getElementById('dados');
  d.innerHTML = '<div class="dado" id="d1">' + cara(a) + '</div>' +
                '<div class="dado" id="d2">' + cara(b) + '</div>';
}

function tirar(){
  const d = document.getElementById('dados');
  d.querySelectorAll('.dado').forEach(x => { x.classList.remove('tirando'); void x.offsetWidth; x.classList.add('tirando'); });
  document.getElementById('total').innerHTML = '…';

  setTimeout(() => {
    const a = 1 + Math.floor(Math.random() * 6);
    const b = 1 + Math.floor(Math.random() * 6);
    pintaDados(a, b);
    const t = a + b;
    const es7 = (t === 7);
    document.getElementById('total').innerHTML =
      'Salio <b>' + t + '</b>' + (es7 ? ' — ¡sale el ladrón! 🥷' : (t === 12 ? ' — ¡jackpot! 🎉' : ''));
  }, 460);
}

document.getElementById('tirar').onclick = tirar;
document.getElementById('nuevo').onclick = () => {
  construye(); pinta();
  document.getElementById('detalle').classList.remove('show');
  pintaDados(0,0);
  document.getElementById('total').textContent = 'Tablero nuevo 🎲';
};

/* arranque */
construye();
pinta();
// los dados arrancan mostrando 1 y 1 para que se vean
pintaDados(1,1);
document.getElementById('total').textContent = 'Toca "Tirar los dados"';
</script>
</body>
</html>
