<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EXTREME — Tablero</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1510">
<style>
  :root{
    --madera:#2a1d15; --madera2:#3a2a1c; --mar:#12293d; --mar2:#0b1a28;
    --crema:#f2e8d5; --tinta:#241a12;
    --fl:#7c4ddb; --fl2:#9d6ef0;
    --bo:#0e8ba8; --bo2:#2bb8d4;
    --ri:#4f8f1e; --ri2:#79b93a;
    --cl:#c1741a; --cl2:#e8a33d;
    --ju:#c73b34; --ju2:#ef6b5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding-top:env(safe-area-inset-top,0px);
    background:linear-gradient(180deg,var(--madera2),var(--madera) 60%);
    color:var(--crema);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none}
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}

  header{text-align:center;padding:16px 18px 8px}
  header h1{margin:0;font-size:31px;font-weight:900;letter-spacing:2.5px;
    background:linear-gradient(180deg,#fff5e0,#e0b877);-webkit-background-clip:text;
    -webkit-text-fill-color:transparent;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  header .sub{font-size:9.5px;letter-spacing:3.6px;color:#b99a6e;font-weight:800;margin-top:5px;text-transform:uppercase}

  .mapa{width:100%;max-width:470px;margin:6px auto 0;display:block;padding:0 8px}
  .hex{cursor:pointer}
  .hex:active{filter:brightness(1.12)}
  .tierra{stroke:#1a1009;stroke-width:2.4;stroke-linejoin:round}
  .relieve{opacity:.42}
  .ico-mapa{pointer-events:none}

  /* la ficha del numero */
  .num circle{fill:var(--crema);stroke:#1a1009;stroke-width:1.9}
  .num text{font-family:-apple-system,sans-serif;font-weight:900;font-size:20px;fill:#2a1d12;
    text-anchor:middle;dominant-baseline:central;letter-spacing:-1px}
  .num.alto text{fill:#b3261e}
  .num .pip{fill:#9a8a6a}

  /* el marcador de spot legendario */
  .spot{cursor:pointer}
  .spot .pl{fill:rgba(20,14,8,.86);stroke:#e0b877;stroke-width:1.4}
  .spot text{font-family:-apple-system,sans-serif;font-weight:800;font-size:7.4px;fill:#f2e8d5;
    text-anchor:middle;letter-spacing:.3px}
  .spot .n{fill:#e0b877;font-size:6.4px}

  /* ===== PANEL DE ABAJO ===== */
  .pie{max-width:470px;margin:2px auto 0;padding:0 18px}
  #detalle{display:none}
  #detalle.show{display:block}
  .carta{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 15px;display:flex;align-items:center;gap:12px}
  .carta .min{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center}
  .carta .min svg{width:64%;height:64%}
  .carta .cn{font-weight:900;font-size:14.5px}
  .carta .cs{font-size:11.5px;color:#b99a6e;margin-top:3px;line-height:1.45}

  #dados{display:flex;gap:16px;justify-content:center;margin:16px 0 6px}
  .dado{width:56px;height:56px;border-radius:12px;position:relative;
    background:linear-gradient(150deg,#fdfaf3,#e4d9bf);box-shadow:0 4px 0 rgba(0,0,0,.4)}
  .dado.tirando{animation:g .5s cubic-bezier(.3,.8,.4,1)}
  @keyframes g{0%{transform:rotate(0)}45%{transform:rotate(200deg) scale(1.13)}100%{transform:rotate(360deg)}}
  .punto{position:absolute;width:10px;height:10px;border-radius:50%;background:#2b3542}
  .punto.tl{left:11px;top:11px}.punto.tr{right:11px;top:11px}
  .punto.ml{left:11px;top:50%;transform:translateY(-50%)}.punto.mr{right:11px;top:50%;transform:translateY(-50%)}
  .punto.bl{left:11px;bottom:11px}.punto.br{right:11px;bottom:11px}
  .punto.mc{left:50%;top:50%;transform:translate(-50%,-50%)}
  #total{text-align:center;font-size:12.5px;color:#b99a6e;margin-top:8px;min-height:19px;font-weight:700}
  #total b{color:#e0b877;font-size:18px}

  .fila{display:flex;gap:9px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .btn{border:none;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:900;font-family:inherit;
    cursor:pointer;color:#241a12;background:linear-gradient(180deg,#f0d093,#d9a94f);
    box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .08s}
  .btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .btn.alt{background:rgba(255,255,255,.09);color:var(--crema);border:1px solid rgba(255,255,255,.18);box-shadow:none}

  .nota{text-align:center;font-size:10.5px;color:#8a7057;margin-top:14px;line-height:1.55;padding:0 4px}
</style>
</head>
<body>

<header>
  <h1>EXTREME</h1>
  <div class="sub">Explore · Ride · Climb · Fly · Jump</div>
</header>

<div class="mapa"><svg id="tablero" viewBox="0 0 466 500"></svg></div>

<div class="pie">
  <div id="detalle"><div class="carta" id="carta"></div></div>
  <div id="dados"></div>
  <div id="total">Toca «Tirar los dados»</div>
  <div class="fila">
    <button class="btn" id="tirar">🎲 Tirar los dados</button>
    <button class="btn alt" id="nuevo">Nuevo mundo</button>
  </div>
  <div class="nota" id="nota">19 hexágonos · 18 discos · 5 deportes</div>
</div>

<script>
/* ============================================================================
   TABLERO DE EXTREME — 19 hexágonos (3-4 jugadores)
   Geometría flat-top por COLUMNAS (3-4-5-4-3), que es la única forma en que
   encajan sin dejar huecos, como un panal.
   ============================================================================ */

const DEPORTES = {
  flight: {n:'FLIGHT',  col:'#7c4ddb', col2:'#9d6ef0', terr:'Cordillera',   hace:'Parapente · parakite · ala delta'},
  board:  {n:'BOARD',   col:'#0e8ba8', col2:'#2bb8d4', terr:'Costa y nieve',hace:'Surf · snowboard · sandboard'},
  ride:   {n:'RIDE',    col:'#4f8f1e', col2:'#79b93a', terr:'Laderas',      hace:'Enduro · MTB · moto'},
  climb:  {n:'CLIMB',   col:'#c1741a', col2:'#e8a33d', terr:'Paredes',      hace:'Escalada · alpinismo'},
  jump:   {n:'JUMP',    col:'#c73b34', col2:'#ef6b5e', terr:'Cumbres',      hace:'Paracaidismo · BASE · wingsuit'},
  nofly:  {n:'NO FLY',  col:'#6b5b48', col2:'#8a7962', terr:'Día sin vuelo',hace:'Aquí empieza el mal tiempo'},
};

/* ===== LOS 5 ICONOS (los que ganaron la prueba a 30 px) ===== */
const ICONOS = {
  flight: `<g fill="#fff"><path d="M4 20 Q20 4 36 20 Q28 15 20 15 Q12 15 4 20 Z"/>
    <path d="M20 15 L20 24 M16 15 L11 25 M24 15 L29 25" stroke="#fff" stroke-width="1.3" fill="none"/>
    <circle cx="20" cy="27" r="3.4"/></g>`,
  board: `<g fill="#fff"><path d="M3 30 Q9 14 21 13 Q31 12 34 21 Q27 26 19 25 Q9 24 3 30 Z"/>
    <ellipse cx="21" cy="30" rx="9" ry="2.6" transform="rotate(-14 21 30)"/></g>`,
  ride: `<g fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round">
    <circle cx="10" cy="27" r="7"/><circle cx="30" cy="27" r="7"/>
    <path d="M10 27 L19 16 L27 16 M19 16 L24 27 M27 16 L30 27 M16 16 L23 16"/></g>`,
  climb: `<g fill="#fff"><path d="M4 34 L20 6 L36 34 Z"/></g>
    <path d="M20 6 L20 34" stroke="rgba(0,0,0,.35)" stroke-width="1.4"/>`,
  jump: `<g fill="#fff"><path d="M20 16 Q6 20 3 30 Q12 27 20 27 Q28 27 37 30 Q34 20 20 16 Z"/>
    <circle cx="20" cy="11" r="4"/></g>`,
  nofly: `<g fill="#fff"><path d="M20 6 L30 16 L26 16 L26 30 L14 30 L14 16 L10 16 Z"/></g>`,
};

const MAZO = [
  ...Array(4).fill('flight'), ...Array(4).fill('board'), ...Array(4).fill('climb'),
  ...Array(3).fill('ride'), ...Array(3).fill('jump'), 'nofly',
];
const NUMS = [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
const COLS = [3,4,5,4,3];

/* Los Spots legendarios del mapa (los de tu maqueta) */
const SPOTS = [
  {n:'THE SUMMIT',        c:'CLIMB + FLIGHT',   pa:'+1 PA'},
  {n:'WINGSUIT MOUNTAIN', c:'CLIMB + JUMP',     pa:'+1 PA'},
  {n:'THE BIG WAVE',      c:'BOARD + RIDE',     pa:'+1 PA'},
  {n:'SOARING DUNES',     c:'FLIGHT + BOARD',   pa:'+1 PA'},
  {n:'ALPINE LAUNCH',     c:'CLIMB + FLIGHT',   pa:'+1 PA'},
  {n:'VOLCANO EXPEDITION',c:'LOS CUATRO',       pa:'+2 PA'},
];

const R = 46, RX = 1.5 * R, RY = Math.sqrt(3) * R;
const CX = 233, CY = 250;

function revuelve(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function pathHex(cx, cy, k){
  const rr = R * (k || 1);
  const p = [];
  for (let i = 0; i < 6; i++){
    const a = (Math.PI / 180) * (60 * i);
    p.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
  }
  return p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ') + ' Z';
}

let layout = [];

function construye(){
  const mazo = revuelve(MAZO);
  const nums = revuelve(NUMS);
  layout = [];
  let k = 0, ni = 0;
  COLS.forEach((cuantos, c) => {
    const cx = CX + (c - 2) * RX;
    const y0 = CY - ((cuantos - 1) * RY) / 2;
    for (let i = 0; i < cuantos; i++){
      const rec = mazo[k++];
      layout.push({cx, cy: y0 + i * RY, rec,
        num: rec === 'nofly' ? null : nums[ni++], id: 'c' + c + '_' + i});
    }
  });
}

function pinta(){
  const svg = document.getElementById('tablero');
  let h = '';
  h += '<defs><radialGradient id="mar" cx="50%" cy="42%" r="74%">' +
       '<stop offset="0%" stop-color="#1b4560"/><stop offset="100%" stop-color="#0b1a28"/></radialGradient>';
  // un degradado por deporte, para que las fichas tengan volumen en vez de color plano
  Object.keys(DEPORTES).forEach(k => {
    const d = DEPORTES[k];
    h += `<radialGradient id="g${k}" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="${d.col2}"/><stop offset="100%" stop-color="${d.col}"/></radialGradient>`;
  });
  h += '</defs>';
  h += '<rect x="0" y="0" width="466" height="500" fill="url(#mar)" rx="0"/>';

  layout.forEach(hex => {
    const d = DEPORTES[hex.rec];
    h += `<g class="hex" data-id="${hex.id}">`;
    h += `<path class="tierra" d="${pathHex(hex.cx, hex.cy)}" fill="url(#g${hex.rec})"/>`;
    h += `<path class="relieve" d="${pathHex(hex.cx, hex.cy, 0.84)}" fill="#fff" opacity=".14"/>`;
    // el icono del deporte
    const esc = hex.rec === 'nofly' ? 0.95 : 0.78;
    const sc = (R * 2 * esc) / 40;
    h += `<g class="ico-mapa" transform="translate(${(hex.cx - 20 * sc).toFixed(1)},${(hex.cy - 20 * sc - (hex.num ? 9 : 0)).toFixed(1)}) scale(${sc.toFixed(3)})">${ICONOS[hex.rec]}</g>`;
    if (hex.num){
      const alto = (hex.num === 6 || hex.num === 8) ? ' alto' : '';
      const cy2 = hex.cy + 19;
      h += `<g class="num${alto}"><circle cx="${hex.cx}" cy="${cy2}" r="16.5"/>`;
      h += `<text x="${hex.cx}" y="${cy2 + 0.5}">${hex.num}</text>`;
      const p = PIPS[hex.num], sep = 4.1, x0 = hex.cx - ((p - 1) * sep) / 2;
      for (let i = 0; i < p; i++) h += `<circle class="pip" cx="${(x0 + i * sep).toFixed(1)}" cy="${cy2 + 10.5}" r="1.4"/>`;
      h += '</g>';
    }
    h += '</g>';
  });

  // Los Spots legendarios: marcadores en el MARCO, fuera del tablero, para que no tapen
  // ninguna ficha. Al tocarlos, el detalle sale abajo.
  const sitios = [[20,26],[446,26],[20,474],[446,474],[233,14],[233,486]];
  SPOTS.forEach((s, i) => {
    const [x, y] = sitios[i] || [0,0];
    h += `<g class="spot" data-spot="${i}">`;
    h += `<circle class="pl" cx="${x}" cy="${y}" r="13"/>`;
    h += `<text x="${x}" y="${y+4.6}" style="font-size:14px">⭐</text>`;
    h += '</g>';
  });

  svg.innerHTML = h;
  svg.querySelectorAll('.hex').forEach(g => g.addEventListener('click', () => muestra(g.getAttribute('data-id'))));
  svg.querySelectorAll('.spot').forEach(g => g.addEventListener('click', () => muestraSpot(g.getAttribute('data-spot'))));
}

function muestra(id){
  const hex = layout.find(x => x.id === id);
  if (!hex) return;
  const d = DEPORTES[hex.rec];
  const prob = hex.num ? (PIPS[hex.num] / 36 * 100).toFixed(1) : null;
  document.getElementById('carta').innerHTML =
    `<div class="min" style="background:radial-gradient(circle at 35% 28%,${d.col2},${d.col})">
       <svg viewBox="0 0 40 40">${ICONOS[hex.rec]}</svg></div>
     <div><div class="cn">${d.terr}${hex.num ? ' · ' + hex.num : ''}</div>
     <div class="cs">${d.hace}${prob ? ' · produce <b>' + prob + '%</b> de las veces' : ' · no produce nunca'}</div></div>`;
  document.getElementById('detalle').classList.add('show');
}
function muestraSpot(i){
  const s = SPOTS[i]; if (!s) return;
  document.getElementById('carta').innerHTML =
    `<div class="min" style="background:linear-gradient(135deg,#e0b877,#b8862f)">
       <span style="font-size:19px">⭐</span></div>
     <div><div class="cn">${s.n}</div>
     <div class="cs">Spot legendario · ${s.c} · vale <b>${s.pa}</b></div></div>`;
  document.getElementById('detalle').classList.add('show');
}

/* ===== DADOS ===== */
const CARAS = [[], ['mc'], ['tl','br'], ['tl','mc','br'], ['tl','tr','bl','br'],
               ['tl','tr','mc','bl','br'], ['tl','tr','ml','mr','bl','br']];
const cara = n => CARAS[n].map(p => `<span class="punto ${p}"></span>`).join('');
function pintaDados(a, b){
  document.getElementById('dados').innerHTML =
    `<div class="dado">${cara(a)}</div><div class="dado">${cara(b)}</div>`;
}
function tirar(){
  const d = document.getElementById('dados');
  d.querySelectorAll('.dado').forEach(x => { x.classList.remove('tirando'); void x.offsetWidth; x.classList.add('tirando'); });
  document.getElementById('total').innerHTML = '…';
  setTimeout(() => {
    const a = 1 + Math.floor(Math.random() * 6), b = 1 + Math.floor(Math.random() * 6);
    pintaDados(a, b);
    const t = a + b;
    document.getElementById('total').innerHTML = 'Salió <b>' + t + '</b>' +
      (t === 7 ? ' — ¡mal tiempo! 🌩️' : (t === 12 ? ' — ¡día épico! 🔥' : ''));
  }, 500);
}
document.getElementById('tirar').onclick = tirar;
document.getElementById('nuevo').onclick = () => {
  construye(); pinta();
  document.getElementById('detalle').classList.remove('show');
  pintaDados(1,1);
  document.getElementById('nota').textContent = '19 hexágonos · 18 discos · 5 deportes';
};

construye(); pinta(); pintaDados(1,1);
</script>
</body>
</html>
