/* coloca la pieza en el vertice (basecamp/hub) o en la arista (ruta) que toques */
async function coloca(tipo, clave, hexIdx){
  const s = await leerSala(salaCod);
  if (!s || s.turno !== yo.id) return;

  /* si toca llevar el Mal Tiempo, el toque es sobre un TERRENO */
  if (tipo === 'clima'){ await mueveClimaA(hexIdx); return; }

  /* ===== SI ESTAMOS COLOCANDO, LAS PIEZAS SON GRATIS y hay que ir en orden ===== */
  if (s.fase === 'colocando'){
    if (s.colocPaso && s.colocPaso !== tipo){
      aviso('Primero ' + NOMBRE[s.colocPaso].toLowerCase(),
            `Toca poner <b>${NOMBRE[s.colocPaso]}</b> antes.`); return;
    }
    const piezas = JSON.parse(JSON.stringify(s.piezas || {}));
    /* OJO: si ya tienes una pieza, piezas[yo.id] YA EXISTE y no trae las tres
       listas. Hay que asegurarlas una a una, o .camino queda undefined y
       revienta al poner la Ruta. */
    piezas[yo.id] = piezas[yo.id] || {};
    piezas[yo.id].base   = piezas[yo.id].base   || [];
    piezas[yo.id].hub    = piezas[yo.id].hub    || [];
    piezas[yo.id].camino = piezas[yo.id].camino || [];
    const lista = tipo === 'camino' ? piezas[yo.id].camino : piezas[yo.id][tipo];
    if (lista.some(p => p.k === clave)){ aviso('Ya hay algo ahí',''); return; }

    /* ===== EN LA COLOCACION CADA UNO PONE DOS =====
       Un Basecamp en la ida y otro en la vuelta (con una Ruta cada uno).
       Sin este tope, si el orden se descuadraba alguien acababa con TRES
       Basecamps y los demas con uno. */
    if (tipo === 'base' && piezas[yo.id].base.length >= 2){
      aviso('Ya tienes tus 2 Basecamps',
            'Se pone uno, y el segundo cuando vuelva tu turno. Ahora toca esperar.'); return;
    }
    if (tipo === 'camino' && piezas[yo.id].camino.length >= 2){
      aviso('Ya tienes tus 2 Rutas',
            'Cada Basecamp lleva una Ruta. Ya pusiste las dos de la colocación inicial.'); return;
    }

    if (tipo === 'base'){
      const hayAlgo = Object.values(piezas).some(p =>
        [...(p.base||[]), ...(p.hub||[])].some(x => x.k === clave));
      if (hayAlgo){ aviso('Ahí ya hay una pieza',''); return; }
      /* en la ida no hace falta tocar ruta; en la vuelta, el Basecamp ya no tiene que tocar nada */
      piezas[yo.id].base.push({ k: clave, hex: hexIdx });
    } else {
      /* la Ruta tiene que salir de tu Basecamp recien puesto */
      /* La Ruta puede salir de CUALQUIERA de tus Basecamps, o seguir
         CUALQUIERA de tus rutas. Antes solo valia el ULTIMO Basecamp que
         pusiste: en la segunda vuelta, o cuando ya tienes rutas por el
         tablero, te decia "pega la ruta a tu basecamp" y no te dejaba seguir. */
      const misPuntos = [
        ...(piezas[yo.id].base  ||[]).map(b => b.k),
        ...(piezas[yo.id].hub   ||[]).map(b => b.k),
        ...(piezas[yo.id].camino||[]).flatMap(r => r.k.split('|').map(e => e.replace(/^a#/, 'v#')))
      ];
      const toca = clave.split('|').some(ar => misPuntos.includes(ar.replace(/^a#/, 'v#')));
      if (!toca){
        aviso('Pega la Ruta a algo tuyo','La Ruta tiene que salir de un Basecamp tuyo o seguir una ruta tuya.');
        return;
      }
      piezas[yo.id].camino.push({ k: clave, hex: hexIdx, v: clave.split('|') });
    }

    /* avanza el orden de colocacion */
    const orden = s.orden || [];
    const n = (s.colocadoEn || 0) + 1;
    /* ===== EL QUE COBRA ES EL **SEGUNDO** BASECAMP =====
       Antes esto dependia del contador de piezas: si el orden salia descuadrado,
       alguien ponia su 2o Basecamp en la ida y NO COBRABA NADA (nos paso en la
       partida AUSQ: Eri con 2 camps y cero recursos). Ahora se mira lo que el
       jugador TIENE de verdad: si este es su segundo Basecamp, cobra. */
    const vuelta = ((piezas[yo.id].base||[]).length === 2) || (n >= orden.length);
    const upd = { piezas };
    if (tipo === 'base' && vuelta){
      /* el SEGUNDO Basecamp YA COBRA: es la produccion inicial de Catan */
      const rec = Object.assign({}, s.recursos || {});
      rec[yo.id] = Object.assign({}, rec[yo.id] || {});
      (s.hexes||[]).forEach((h, i) => {
        if (!h.num) return;
        const toca = tocaHex(piezas[yo.id], i);
        if (toca > 0) rec[yo.id][h.rec] = (rec[yo.id][h.rec]||0) + toca;
      });
      upd.recursos = rec;
      const gano = Object.entries(rec[yo.id]).filter(([,v]) => v>0)
        .map(([k,v]) => v + ' ' + k.toUpperCase()).join(' · ');
      aviso('🎁 Producción inicial', gano || 'ese rincón no produce');
    }
    /* cada Basecamp vale 1 Punto de Aventura — TAMBIEN en la colocacion inicial */
    if (tipo === 'base'){
      const pa = Object.assign({}, s.pa || {});
      pa[yo.id] = (pa[yo.id] || 0) + 1;
      upd.pa = pa;
    }
    upd.colocadoEn = n;
    upd.colocPaso = (tipo === 'base') ? 'camino' : null;
    if (n >= orden.length * 2){
      /* todos han puesto sus dos piezas: EMPIEZA LA PARTIDA */
      upd.fase = 'juego'; upd.turno = (s.anfitrion || orden[0]); upd.colocPaso = null;
    } else {
      /* OJO: cada jugador pone DOS piezas (camp y ruta), y "n" cuenta PIEZAS.
         Por eso hay que dividir entre 2 para saber a quien le toca. Si no, se
         saltaba jugadores: iba J1, J3, J5, J6, J4, J2… */
      if (!upd.colocPaso) upd.turno = orden[Math.floor(n/2) % orden.length];
    }
    await update(ref(db,'extreme/salas/'+salaCod), upd);
    if (tipo === 'base') aviso('✔ Basecamp puesto', 'Ahora toca una <b>RUTA</b> que salga de ahí', 1600);
    return;
  }

  /* ===== YA JUGANDO: se paga ===== */
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  let coste = COSTES[tipo];
  /* las 2 Rutas gratis de la carta "Dos rutas gratis" no se pagan */
  const gratisMio = (s.gratis && s.gratis[yo.id]) || 0;
  const esGratis = (tipo === 'camino' && gratisMio > 0);
  if (esGratis) coste = {};
  if (!alcanza(mis, coste)){
    aviso('No te llega', `Necesitas <b>${textoCoste(coste)}</b><br>y tienes: ${
      Object.entries(mis).filter(([,v])=>v>0).map(([k,v])=>v+' '+k.toUpperCase()).join(' + ') || 'nada'}`);
    return;
  }
  const piezas = JSON.parse(JSON.stringify(s.piezas || {}));
  /* OJO: si ya tienes una pieza, piezas[yo.id] YA EXISTE y no trae las tres
       listas. Hay que asegurarlas una a una, o .camino queda undefined y
       revienta al poner la Ruta. */
    piezas[yo.id] = piezas[yo.id] || {};
    piezas[yo.id].base   = piezas[yo.id].base   || [];
    piezas[yo.id].hub    = piezas[yo.id].hub    || [];
    piezas[yo.id].camino = piezas[yo.id].camino || [];
  const lista = tipo === 'camino' ? piezas[yo.id].camino : piezas[yo.id][tipo];
  if (lista.some(p => p.k === clave)){ aviso('Ya hay algo ahí',''); return; }

  if (tipo === 'base'){
    if (piezas[yo.id].base.length + piezas[yo.id].hub.length >= 5){
      aviso('Sin piezas', 'Ya tienes 5 Basecamps y Hubs (el máximo). Súbelos a Hub.'); return;
    }
    /* tiene que tocar una de tus rutas (o ser el primero) */
    /* vale si la ruta sale de tu Basecamp o sigue otra ruta tuya */
    const misPuntos2 = [
      ...(piezas[yo.id].base  ||[]).map(b => b.k),
      ...(piezas[yo.id].hub   ||[]).map(b => b.k),
      ...(piezas[yo.id].camino||[]).flatMap(r => r.k.split('|').map(e => e.replace(/^a#/, 'v#')))
    ];
    const toca = clave.split('|').some(ar => misPuntos2.includes(ar.replace(/^a#/, 'v#')));
    const hayAlgo = Object.values(piezas).some(p => [...(p.base||[]), ...(p.hub||[])].some(x => x.k === clave));
    if (hayAlgo){ aviso('Ya hay una pieza ahí',''); return; }
    /* un Basecamp tiene que pegarse a algo tuyo (tus rutas o tus Basecamps).
       OJO: aqui ponia "rutas.length", una variable que NO EXISTE en ningun
       sitio: era un ReferenceError y la funcion reventaba, asi que al comprar
       un Basecamp no se ponia nada. */
    if (!toca && misPuntos2.length){
      aviso('Lejos', 'Un Basecamp tiene que tocar una de tus rutas o uno de tus Basecamps.'); return;
    }
    lista.push({ k: clave, hex: hexIdx });
  } else if (tipo === 'hub'){
    const mio = [...(piezas[yo.id].base||[]), ...(piezas[yo.id].hub||[])].find(x => x.k === clave);
    if (!mio){ aviso('No es tuyo', 'Solo puedes subir a Hub un Basecamp tuyo.'); return; }
    piezas[yo.id].base = piezas[yo.id].base.filter(x => x.k !== clave);
    piezas[yo.id].hub.push({ k: clave, hex: mio.hex });
  } else {
    lista.push({ k: clave, hex: hexIdx, v: clave.split('|') });
  }
  const rec = Object.assign({}, s.recursos || {});
  rec[yo.id] = cobra(mis, coste);
  const pa = Object.assign({}, s.pa || {});
  if (tipo === 'base') pa[yo.id] = (pa[yo.id]||0) + 1;
  if (tipo === 'hub')  pa[yo.id] = (pa[yo.id]||0) + 1;
  const upd2 = { piezas, recursos: rec, pa };
  if (esGratis){
    const g = Object.assign({}, s.gratis || {});
    g[yo.id] = Math.max(0, gratisMio - 1);
    if (!g[yo.id]) delete g[yo.id];
    upd2.gratis = g;
  }
  await update(ref(db,'extreme/salas/'+salaCod), upd2);
  ponModo(null);
  aviso('✔ ' + NOMBRE[tipo] + ' puesto',
        esGratis ? '¡Gratis! (carta de aventura)' : 'Gastaste ' + textoCoste(coste));
  revisaLogros(await leerSala(salaCod));
  return true;                       /* el bot necesita saber si funciono */
}

/* ===== AVANZAR LA COLOCACION SIN COLOCAR NADA =====
   Si un jugador (o un bot) no puede poner nada, hay que saltarle. Antes el bot
   se salia sin hacer nada y volvia a intentarlo: bucle infinito, la partida se
   atoraba al principio. */
async function avanzaColocacion(){
  const s = await leerSala(salaCod);
  if (!s || s.fase !== 'colocando' || s.turno !== yo.id) return;
  const orden = s.orden || [];
  const n = (s.colocadoEn || 0) + 1;
  if (n >= orden.length){
    await update(ref(db,'extreme/salas/'+salaCod),
      { fase:'juego', colocadoEn:n, turno: orden[0], dados:null, colocPaso:null });
    aviso('🚀 ¡Empieza la partida!', 'Ya está todo colocado');
    return;
  }
  await update(ref(db,'extreme/salas/'+salaCod),
    { colocadoEn:n, turno: orden[Math.floor(n/2) % orden.length], colocPaso:null });
}

/* ===== VOLVER A PINTAR: recursos, dados y piezas encima del tablero ===== */
function pintaPartida(s){
  pintaBarra(s);
  pintaRecursos(s);
  pintaOfertas(s);
  const svg = $('tablero');
  if (!svg) return;
  /* quito las capas de piezas y las vuelvo a poner */
  svg.querySelectorAll('.capaPiezas,.capaTocar').forEach(n => n.remove());
  const P = s.piezas || {};
  let h = '<g class="capaPiezas">';
  Object.entries(P).forEach(([id, pp]) => {
    const col = COLORES.find(c => c.id === ((s.jugadores||{})[id]||{}).color) || COLORES[0];
    (pp.camino||[]).forEach(r => {
      const v = r.v || r.k.split('|');
      h += `<line x1="${v[0].split('#')[1]}" y1="${v[0].split('#')[2]}" x2="${v[1].split('#')[1]}"
             y2="${v[1].split('#')[2]}" stroke="${col.c}" stroke-width="8" stroke-linecap="round"
             opacity=".92" stroke-dasharray="1000" stroke-dashoffset="0"/>`;
    });
    (pp.base||[]).forEach(b => {
      const [x,y] = b.k.split('#').slice(1);
      h += `<circle cx="${x}" cy="${y}" r="8" fill="${col.c}" stroke="#1a1009" stroke-width="2.4"/>`;
    });
    (pp.hub||[]).forEach(b => {
      const [x,y] = b.k.split('#').slice(1);
      h += `<circle cx="${x}" cy="${y}" r="11" fill="${col.c}" stroke="#f0d899" stroke-width="2.6"/>`;
    });
  });
  h += '</g>';
  /* ===== EL MAL TIEMPO ENCIMA DEL TABLERO ===== */
  if (s.clima != null && s.hexes && s.hexes[s.clima]){
    const hc = s.hexes[s.clima];
    const pos = posHex(hc.c, hc.i);
    if (pos) h += `<g class="clima">
      <circle cx="${pos.cx.toFixed(1)}" cy="${pos.cy.toFixed(1)}" r="${(R*0.52).toFixed(1)}"
        fill="rgba(16,12,7,.74)" stroke="#8fb6ff" stroke-width="2.6"
        style="filter:drop-shadow(0 0 10px rgba(143,182,255,.8))"/>
      <text x="${pos.cx.toFixed(1)}" y="${(pos.cy+10).toFixed(1)}" text-anchor="middle"
        style="font-size:27px">🌩️</text></g>`;
  }
  /* ===== SI TE TOCA LLEVAR EL MAL TIEMPO, TOCA UN TERRENO ===== */
  if (s.mueveElClima === yo.id){
    h += '<g class="capaTocar capaClima">';
    (s.hexes || []).forEach((hh, idx) => {
      if (idx === s.clima) return;
      const pos = posHex(hh.c, hh.i);
      if (!pos) return;
      h += `<circle class="toque toqClima" data-t="clima" data-k="c${idx}" data-h="${idx}"
             cx="${pos.cx.toFixed(1)}" cy="${pos.cy.toFixed(1)}" r="${(R*0.72).toFixed(1)}"
             fill="rgba(150,190,255,.30)" stroke="#bcd8ff" stroke-width="2.5"
             style="filter:drop-shadow(0 0 9px #6fa8ff)"/>`;
    });
    h += '</g>';
  }
  /* capa de puntos para TOCAR (solo visible cuando estas construyendo) */
  if (modo && s.turno === yo.id){
    h += '<g class="capaTocar">';
    V = {}; A = {};
    (s.hexes||[]).forEach((hh, idx) => {
      const { cx, cy } = posHex(hh.c, hh.i);
      const pts = [];
      for (let i=0;i<6;i++){
        const a = Math.PI/180*(60*i);
        pts.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]);
      }
      pts.forEach((p,i) => {
        const k = `v#${p[0].toFixed(1)}#${p[1].toFixed(1)}`;
        if (!V[k]) V[k] = { x:p[0], y:p[1], n:0, hex:idx };
        V[k].n++;
      });
      for (let i=0;i<6;i++){
        const a = pts[i], b = pts[(i+1)%6];
        /* el MISMO formato que usa el dibujo: a#x1#y1|a#x2#y2 (sin comas) */
        const k = `a#${a[0].toFixed(1)}#${a[1].toFixed(1)}|a#${b[0].toFixed(1)}#${b[1].toFixed(1)}`;
        if (!A[k]) A[k] = { a, b, hex: idx };
      }
    });
    /* ===== LO QUE DE VERDAD PUEDES PONER =====
       Antes se encendia TODO, y no te guiaba. Ahora solo sale en verde lo que
       el reglamento te permite: los caminos que salen de tus Basecamps (o
       siguen tus rutas), y los cruces donde puedes poner un Basecamp. */
    const P = piezasDe(s);
    /* TODAS las piezas de la mesa (mias y de los demas) */
    const TODAS = [];
    Object.values(s.piezas || {}).forEach(pp => {
      (pp.base  ||[]).forEach(x => TODAS.push({ t:'base',  k:x.k }));
      (pp.hub   ||[]).forEach(x => TODAS.push({ t:'hub',   k:x.k }));
      (pp.camino||[]).forEach(x => TODAS.push({ t:'camino', k:x.k }));
    });
    const misBases  = P.filter(x => x.t === 'base' || x.t === 'hub').map(x => x.k);
    const misRutas  = P.filter(x => x.t === 'camino').map(x => x.k);
    const puntosDeRuta = misRutas.flatMap(rk => rk.split('|'));
    /* un cruce vale si NO tiene una pieza y NO toca el camp de nadie:
       en Catan los campamentos no pueden pegarse unos a otros. */
    const basesDeTodos = TODAS.filter(x => x.t==='base' || x.t==='hub').map(x => x.k);
    /* los vecinos de cada cruce: los que une una arista del tablero */
    const vecinosDe = {};
    Object.keys(A).forEach(kk => {
      const partes = kk.split('|');
      const v1 = partes[0].replace(/^a#/, 'v#'), v2 = partes[1].replace(/^a#/, 'v#');
      (vecinosDe[v1] = vecinosDe[v1] || []).push(v2);
      (vecinosDe[v2] = vecinosDe[v2] || []).push(v1);
    });
    const libres = k => {
      if (TODAS.some(x => (x.t==='base'||x.t==='hub') && x.k === k)) return false;
      /* ningun camp a un cruce de distancia: es la regla de Catan */
      const vec = vecinosDe[k] || [];
      if (vec.some(v => basesDeTodos.includes(v))) return false;
      return true;
    };

    if (modo === 'camino'){
      Object.entries(A).forEach(([kk, x]) => {
        const extremos = kk.split('|');
        /* vale si un extremo es un vertice con TU base o con TU ruta */
        const vale = extremos.some(e => {
          const vk = e.replace(/^a#/, 'v#');
          return misBases.includes(vk) || puntosDeRuta.includes(e);
        });
        if (!vale) return;
        h += `<line class="toque toqCamino" data-t="camino" data-k="${kk}" data-h="${x.hex}"
               x1="${x.a[0]}" y1="${x.a[1]}" x2="${x.b[0]}" y2="${x.b[1]}"
               stroke="#5df08a" stroke-width="12" stroke-linecap="round"
               stroke-dasharray="9 6" style="filter:drop-shadow(0 0 7px #2fd45f)"/>`;
      });
    } else {
      Object.entries(V).forEach(([k, x]) => {
        if (x.n < 2) return;
        if (!libres(k)) return;                    /* ya hay una pieza ahi */
        /* Al CONSTRUIR (ya jugando) el Basecamp tiene que pegarse a algo tuyo.
           Pero en la COLOCACION INICIAL va donde quieras (mientras no toque
           otro camp): si no, en la segunda vuelta te escondia TODOS los cruces
           y parecia que el juego no te dejaba poner nada. */
        if (misRutas.length && s.fase !== 'colocando'){
          const pega = misRutas.some(rk => rk.split('|').some(e => e.replace(/^a#/,'v#') === k));
          if (!pega) return;
        }
        h += `<circle class="toque toqVert" data-t="${modo}" data-k="${k}" data-h="${x.hex}"
               cx="${x.x}" cy="${x.y}" r="13"
               fill="rgba(93,240,138,.55)" stroke="#eafff0" stroke-width="2.5"
               style="filter:drop-shadow(0 0 8px #2fd45f)"/>`;
      });
      /* ===== SI NO HAY NINGUNO A MANO, ENSENO DONDE ESTAN LOS HUECOS =====
         Con 6 jugadores el tablero va apretado: los cruces libres quedan lejos
         de tus Rutas. Sin esto solo se ve "no me deja" aunque SI hay sitio.
         Los pinto en DORADO para que se vea hacia donde hay que alargar. */
      if (s.fase !== 'colocando' && !h.includes('toqVert')){
        let huecos = 0;
        Object.entries(V).forEach(([k, x]) => {
          if (x.n < 2) return;
          if (!libres(k)) return;
          huecos++;
          h += `<circle class="toqHueco" cx="${x.x}" cy="${x.y}" r="10"
                 fill="rgba(240,216,153,.28)" stroke="#f0d899" stroke-width="2"
                 style="filter:drop-shadow(0 0 7px #f0d899)"/>`;
        });
        if (huecos) setTimeout(() => aviso('🏕️ Hay ' + huecos + ' cruces libres… pero lejos',
          'Ninguno toca tus Rutas todavía, y un Basecamp tiene que estar pegado a una Ruta tuya.<br>' +
          '<b>Pulsa RUTA y alarga una hacia un punto DORADO.</b>', 8000), 450);
      }
    }
    h += '</g>';
  }
  h += '<g class="capaOutposts">';
  OUTPOSTS.forEach(o => {
    const col = o.r ? (RECURSOS.find(x => x.id === o.r) || {}) : {};
    h += `<g class="outpost">
      <circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="15"
        fill="#2a1d12" stroke="#c9a558" stroke-width="2.2"
        style="filter:drop-shadow(0 2px 5px rgba(0,0,0,.85))"/>
      <text x="${o.x.toFixed(1)}" y="${(o.y-1).toFixed(1)}" text-anchor="middle"
        style="font-family:Anton,sans-serif;font-size:11px;fill:#f0d899">${o.t}</text>
      ${o.r ? `<text x="${o.x.toFixed(1)}" y="${(o.y+9.5).toFixed(1)}" text-anchor="middle"
        style="font-family:Anton,sans-serif;font-size:7.5px;fill:#fff">${(col.n||'').slice(0,4)}</text>` : ''}
    </g>`;
  });
  h += '</g>';
  svg.insertAdjacentHTML('beforeend', h);
  /* UN SOLO manejador para todo el tablero. Asi da igual que sea un circulo o
     una linea, y no importa que el SVG se repinte: siempre funciona. */
  /* ===== TOCAR FACIL =====
     Antes habia que acertarle a una linea fina. Ahora el juego coge la arista
     (o el cruce) MAS CERCANO a donde tocas, como el Catan digital. */
  svg.onclick = (e) => {
    const todos = [...svg.querySelectorAll('.toque')];
    if (!todos.length) return;

    /* 1) lo normal: el toque trae coordenadas -> cojo la arista MAS CERCANA
          (radio generoso, que es un dedo y no un raton) */
    if (e.clientX || e.clientY){
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      let p;
      try { p = pt.matrixTransform(svg.getScreenCTM().inverse()); } catch(err){ p = null; }
      if (p){
        let mejor = null, mejorD = Infinity;
        todos.forEach(el => {
          let d;
          if (el.tagName === 'line'){
            d = distPuntoSegmento(p.x, p.y, +el.getAttribute('x1'), +el.getAttribute('y1'),
                                                +el.getAttribute('x2'), +el.getAttribute('y2'));
          } else {
            d = Math.hypot(p.x - +el.getAttribute('cx'), p.y - +el.getAttribute('cy'));
          }
          if (d < mejorD){ mejorD = d; mejor = el; }
        });
        if (mejor && mejorD <= 34){ coloca(mejor.dataset.t, mejor.dataset.k, +mejor.dataset.h); return; }
      }
    }

    /* 2) respaldo: si el navegador no dio coordenadas, uso lo que se toco */
    const el = (e.target && e.target.closest) ? e.target.closest('.toque') : null;
    if (el) coloca(el.dataset.t, el.dataset.k, +el.dataset.h);
  };
}

/* ==========================================================================
   EL COMERCIO
   - Ofreces recursos a los demas: ellos aceptan o rechazan.
   - O cambias con el banco a 4:1 (4 de uno por 1 de otro).
   ========================================================================== */
let doy = {}, pido = {};

/* ===== RESPONDER A UNA OFERTA CON OTRA PROPUESTA =====
   respondoA guarda a QUIEN le estoy respondiendo. Si es null, la oferta va a
   todos (lo normal). Si tiene un id, va solo para esa persona. */
let respondoA = null;

function abreComercio(para){
  doy = {}; pido = {}; respondoA = (typeof para === 'string') ? para : null;
  pintaPanel();
  $('panelComercio').classList.add('on');
}
$('pcCerrar').onclick = () => { $('panelComercio').classList.remove('on'); respondoA = null; };
$('bComercio').onclick = () => abreComercio(null);

async function pintaPanel(){
  const s = await leerSala(salaCod);
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  const pinta = (cont, obj, cual) => {
    $(cont).innerHTML = RECURSOS.map(c => {
      const tengo = mis[c.id] || 0;
      const n = obj[c.id] || 0;
      const puede = (cual === 'doy') ? tengo > 0 : true;
      return `<span class="cartaPC${n?' on':''}" data-l="${cual}" data-c="${c.id}"
        ${puede?'':'style="opacity:.2;pointer-events:none"'}
        title="${c.n}"><img src="${c.carta}" alt="${c.n}">
        <span class="n">${cual==='doy' ? (n?n+'/'+tengo:tengo) : (n||'')}</span></span>`;
    }).join('');
    /* ===== AL TOCAR, SUMA DE UNO EN UNO =====
       Toca 3 veces la misma carta para dar 3. Al pasar del máximo vuelve a
       empezar, así se quita. Antes solo dejaba poner 1 y no había forma de
       elegir cuántos. */
    $(cont).querySelectorAll('.cartaPC').forEach(el => el.onclick = () => {
      const c = el.dataset.c;
      const tope = (cual === 'doy') ? (mis[c] || 0) : 5;
      const n = (obj[c] || 0) + 1;
      if (n > tope) delete obj[c]; else obj[c] = n;
      pintaPanel();
    });
  };
  pinta('doy', doy, 'doy');
  pinta('pido', pido, 'pido');
  const nDoy = Object.values(doy).reduce((a,b)=>a+b,0);
  const nPido = Object.values(pido).reduce((a,b)=>a+b,0);
  /* ===== EL RESUMEN DEL TRATO (para que veas lo que ofreces) ===== */
  const txtT = (o) => Object.entries(o).map(([k,v]) => v + ' ' + k.toUpperCase()).join(' + ');
  const pista = $('pcPista');
  if (pista){
    pista.innerHTML = (nDoy || nPido)
      ? 'Das <b>' + (txtT(doy) || '—') + '</b> &nbsp;·&nbsp; quieres <b>' + (txtT(pido) || '—') + '</b>'
      : 'Toca una carta para <b>DAR</b> y otra para <b>PEDIR</b>.<br>Toca varias veces la misma para dar más de una.';
  }

  /* el boton del banco ensena tu mejor tasa (con outpost baja) */
  const queDoy = Object.keys(doy);
  const miTasa = (queDoy.length === 1) ? tasaDe(s, queDoy[0]) : 4;
  const mejor = RECURSOS.reduce((m, c) => Math.min(m, tasaDe(s, c.id)), 4);
  /* ===== SI ESTOY RESPONDIENDO A ALGUIEN =====
     El banco no pinta nada aqui, y el boton dice a quien le mando la propuesta. */
  const nombrePara = respondoA ? (((s.jugadores || {})[respondoA] || {}).nombre || '?') : '';
  const h3p = $('panelComercio').querySelector('h3');
  if (h3p) h3p.textContent = respondoA ? ('🤝 Proponer a ' + nombrePara) : '🔄 Comerciar';
  $('pcBanco').style.display = respondoA ? 'none' : '';
  $('pcOfrecer').textContent = respondoA
    ? ('🤝 PROPONER A ' + nombrePara.toUpperCase())
    : 'OFRECER A LOS DEMÁS';
  $('pcBanco').textContent = (nDoy && nPido)
    ? `BANCO · ${nDoy} por ${nPido}`
    : (mejor < 4 ? `AL BANCO (${mejor}:1) 🏕️` : `AL BANCO — elige ${miTasa} del mismo`);
}

/* al banco: 4 de uno por 1 de otro */
$('pcBanco').onclick = async () => {
  const d = Object.keys(doy), q = Object.keys(pido);
  const nDoy = Object.values(doy).reduce((a,b)=>a+b,0);
  const nPido = Object.values(pido).reduce((a,b)=>a+b,0);
  const s = await leerSala(salaCod);
  /* la tasa depende de tus outposts: 4:1 normal, 3:1 o 2:1 si tienes puerto */
  const cuantos = (d.length === 1) ? tasaDe(s, d[0]) : 4;
  if (d.length !== 1 || q.length !== 1 || nPido !== 1 || nDoy !== cuantos){
    const titulo = cuantos < 4 ? 'Tu outpost te deja ' + cuantos + ':1' : 'Al banco: 4 por 1';
    aviso(titulo, `Elige <b>${cuantos} de UN recurso</b> que das, y <b>1</b> que quieres.`); return;
  }
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  if ((mis[d[0]]||0) < cuantos){ aviso('No te llega', 'Necesitas ' + cuantos + ' ' + d[0].toUpperCase()); return; }
  const rec = Object.assign({}, s.recursos || {});
  rec[yo.id] = Object.assign({}, mis);
  rec[yo.id][d[0]] -= cuantos; rec[yo.id][q[0]] = (rec[yo.id][q[0]]||0) + 1;
  await update(ref(db,'extreme/salas/'+salaCod), { recursos: rec });
  $('panelComercio').classList.remove('on');
  aviso('🔄 Cambio con el banco',
        `Diste ${cuantos} ${d[0].toUpperCase()} y cogiste 1 ${q[0].toUpperCase()}` +
        (cuantos < 4 ? ' 🏕️ ¡tu outpost!' : ''));
};

/* ofrecer a los demas */
$('pcOfrecer').onclick = async () => {
  const nDoy = Object.values(doy).reduce((a,b)=>a+b,0);
  const nPido = Object.values(pido).reduce((a,b)=>a+b,0);
  if (!nDoy || !nPido){ aviso('Falta algo', 'Elige qué <b>das</b> y qué <b>quieres</b>.'); return; }
  const s = await leerSala(salaCod);
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  for (const k in doy) if ((mis[k]||0) < doy[k]){
    aviso('No te llega', `No tienes ${doy[k]} ${k.toUpperCase()}`); return;
  }
  const ofertas = Object.assign({}, s.ofertas || {});
  const oid = 'o' + Date.now();
  const para = respondoA;
  ofertas[oid] = { de: yo.id, doy: Object.assign({}, doy), pido: Object.assign({}, pido), t: Date.now() };
  if (para){
    /* ===== CONTRA-OFERTA: va SOLO para el que me la hizo =====
       Y la suya la doy por rechazada, para no tener dos conversaciones abiertas. */
    ofertas[oid].para = para;
    for (const k in ofertas){
      if (k !== oid && ofertas[k].de === para && !(ofertas[k].no && ofertas[k].no[yo.id])){
        ofertas[k] = Object.assign({}, ofertas[k]);
        ofertas[k].no = Object.assign({}, ofertas[k].no || {});
        ofertas[k].no[yo.id] = true;
      }
    }
  }
  await update(ref(db,'extreme/salas/'+salaCod), { ofertas });
  $('panelComercio').classList.remove('on');
  respondoA = null;
  aviso(para ? '🤝 Propuesta enviada' : '🔄 Oferta enviada',
        para ? ('Solo la verá ' + (((s.jugadores || {})[para] || {}).nombre || '?') + '. A ver qué dice.')
             : 'Los demás la verán, y podrán aceptarla o proponerte otra cosa');
};

/* pintar las ofertas que hay en la mesa */
function pintaOfertas(s){
  const of = s.ofertas || {};
  const el = $('ofertas');
  if (!el) return;
  const nombres = {};
  Object.entries(s.jugadores || {}).forEach(([id,j]) => nombres[id] = j.nombre || '?');
  const txt = (o) => Object.entries(o).map(([k,v]) => `<b>${v}</b> ${k.toUpperCase()}`).join(' + ');
  const claves = Object.keys(of);
  /* en la lista de abajo, tampoco te enseno las que ya rechazaste, ni las
     contra-ofertas que van para otro */
  const visibles = claves.filter(k => (of[k].de === yo.id
    || (of[k].de !== yo.id && !(of[k].no && of[k].no[yo.id])))
    && (!of[k].para || of[k].para === yo.id || of[k].de === yo.id));
  el.innerHTML = visibles.length ? visibles.map(k => {
    const o = of[k];
    const mia = (o.de === yo.id);
    const puedo = !mia && Object.entries(o.pido).every(([r,n]) =>
      ((s.recursos && s.recursos[yo.id] && s.recursos[yo.id][r]) || 0) >= n);
    return `<div class="oferta">
      <div class="quien">${nombres[o.de] || '?'} ofrece</div>
      <div class="cambio">da <b>${txt(o.doy)}</b><br>y quiere <b>${txt(o.pido)}</b></div>
      ${ mia ? `<div class="mia">Tu oferta — esperando respuesta…</div>
                <div class="bb"><button class="no" data-x="${k}">RETIRAR</button></div>`
            : `<div class="bb">
                 <button class="si" data-a="${k}" ${puedo?'':'disabled style="opacity:.4"'}>ACEPTAR</button>
                 <button class="no" data-r="${k}">RECHAZAR</button>
               </div>`}
    </div>`;
  }).join('') : '';
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => responde(b.dataset.a, true));
  el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => responde(b.dataset.r, false));
  el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => responde(b.dataset.x, null));

  /* ===== TE SALTAN A LA PANTALLA, Y HAY QUE RESPONDER =====
     Antes las ofertas salian en una lista debajo del tablero, y era facil no
     verlas y seguir jugando. Ahora, si alguien te ofrece un trato, te salta un
     aviso que TAPA TODO: tienes que aceptar o rechazar antes de seguir. */
  const pv = $('panelOferta');
  if (!pv) return;
  /* las que YA rechace no me las vuelvas a ensenar; y las CONTRA-OFERTAS
     (las que llevan 'para') solo las ve la persona a la que van */
  const otras = claves.filter(k => of[k].de !== yo.id
    && !(of[k].no && of[k].no[yo.id])
    && (!of[k].para || of[k].para === yo.id));
  const mias  = claves.filter(k => of[k].de === yo.id);
  if (otras.length){
    const k = otras[0], o = of[k];
    const puedo = Object.entries(o.pido).every(([r,n]) =>
      ((s.recursos && s.recursos[yo.id] && s.recursos[yo.id][r]) || 0) >= n);
    $('ofTit').textContent = '🔄 ' + (nombres[o.de] || '?') + ' te ofrece un trato';
    /* ===== TUS RECURSOS, DENTRO DEL POPUP =====
       Sin esto te pedia decidir a ciegas: no podias mirar lo que tienes porque
       el popup tapa la pantalla. Ahora salen aqui, y los que TE PIDEN van
       marcados con un aro dorado. */
    const misRec = (s.recursos && s.recursos[yo.id]) || {};
    const fila = '<div class="recursos ofRecs">' + RECURSOS.map(c => {
      const n2 = misRec[c.id] || 0;
      const pide = Object.prototype.hasOwnProperty.call(o.pido, c.id);
      return `<span class="cartaRec${n2 ? '' : ' vacia'}${pide ? ' pide' : ''}"
        title="${c.n}${pide ? ' — te lo piden' : ''}">
        <img src="${c.mini}" alt="${c.n}"><b>${n2}</b></span>`;
    }).join('') + '</div>';
    $('ofTxt').innerHTML = 'Te da <b>' + txt(o.doy) + '</b><br>y quiere <b>' + txt(o.pido) + '</b>' +
      fila +
      '<div class="ofQueTengo">Esto es lo que tienes' +
      (puedo ? '' : ' — <b style="color:#ffb3a3">no te llega lo que pide</b>') + '</div>' +
      (otras.length > 1 ? '<div class="ofQueTengo">(y ' + (otras.length - 1) + ' oferta más esperando)</div>' : '');
    $('ofSi').style.display = '';
    $('ofSi').disabled = !puedo;
    $('ofSi').textContent = puedo ? 'ACEPTAR' : 'NO TE LLEGA';
    $('ofNo').textContent = 'RECHAZAR';
    $('ofSi').onclick = () => responde(k, true);
    $('ofNo').onclick = () => responde(k, false);
    /* ===== PROPONER OTRA COSA =====
       Estilo Catan: nadie esta obligado a decir que si a la primera. Le doy
       por rechazada SU oferta (para no tener dos frentes abiertos) y abro el
       comercio respondiendole SOLO a esa persona, con otras cantidades. */
    $('ofOtra').style.display = '';
    $('ofOtra').onclick = async () => {
      const quien = o.de;
      const su = await leerSala(salaCod);
      const ofs = Object.assign({}, (su || {}).ofertas || {});
      if (ofs[k]){
        ofs[k] = Object.assign({}, ofs[k]);
        ofs[k].no = Object.assign({}, ofs[k].no || {});
        ofs[k].no[yo.id] = true;
        await update(ref(db,'extreme/salas/'+salaCod), { ofertas: ofs });
      }
      pv.classList.remove('on');
      abreComercio(quien);
    };
    pv.classList.add('on');
  } else if (mias.length && !$('panelComercio').classList.contains('on')){
    const o = of[mias[0]];
    $('ofTit').textContent = '⏳ Tu oferta está en la mesa';
    $('ofTxt').innerHTML = 'Das <b>' + txt(o.doy) + '</b> y quieres <b>' + txt(o.pido) +
      '</b><br>Esperando a que alguien la acepte…';
    $('ofSi').style.display = 'none';
    $('ofOtra').style.display = 'none';
    $('ofNo').textContent = 'RETIRAR MI OFERTA';
    $('ofNo').onclick = () => responde(mias[0], null);
    pv.classList.add('on');
  } else {
    pv.classList.remove('on');
  }
}

/* aceptar, rechazar o retirar una oferta */
async function responde(oid, acepta){
  const s = await leerSala(salaCod);
  const o = (s.ofertas || {})[oid];
  if (!o) return;
  const ofertas = Object.assign({}, s.ofertas || {});
  if (acepta === null){ delete ofertas[oid]; }
  else if (acepta){
    /* el cambio de verdad */
    const rec = Object.assign({}, s.recursos || {});
    rec[o.de]  = Object.assign({}, rec[o.de]  || {});
    rec[yo.id] = Object.assign({}, rec[yo.id] || {});
    for (const k in o.doy){                     /* de -> yo */
      rec[o.de][k]  = (rec[o.de][k]||0) - o.doy[k];
      rec[yo.id][k] = (rec[yo.id][k]||0) + o.doy[k];
    }
    for (const k in o.pido){                    /* yo -> de */
      rec[yo.id][k] = (rec[yo.id][k]||0) - o.pido[k];
      rec[o.de][k]  = (rec[o.de][k]||0) + o.pido[k];
    }
    delete ofertas[oid];
    await update(ref(db,'extreme/salas/'+salaCod), { recursos: rec, ofertas });
    aviso('✔ Trato hecho', 'Se ha hecho el cambio');
    return;
  } else {
    /* ===== RECHAZAR =====
       Antes esto solo apuntaba un numero en 'rechazo' y la oferta SEGUIA en la
       mesa, asi que el aviso volvia a salir y no te dejaba rechazar nunca.
       Ahora: si tu la rechazas, NO te la vuelvo a enseñar. La oferta sigue
       viva para los demas (en Catan rechazas por ti, no por los otros), y si
       la rechazan TODOS menos el que la hizo, se retira sola. */
    ofertas[oid] = Object.assign({}, ofertas[oid]);
    ofertas[oid].no = Object.assign({}, ofertas[oid].no || {});
    ofertas[oid].no[yo.id] = true;
    const otros = Object.keys(s.jugadores || {}).filter(id => id !== o.de);
    if (otros.length && otros.every(id => ofertas[oid].no[id])){
      const limpio = Object.assign({}, ofertas);
      delete limpio[oid];
      await update(ref(db,'extreme/salas/'+salaCod), { ofertas: limpio });
      aviso('🚫 Oferta retirada', 'Nadie la quiso, así que se ha quitado.');
      return;
    }
    aviso('🚫 Rechazada', 'No te la volveremos a ofrecer. Sigue en la mesa para los demás.', 3200);
  }
  await update(ref(db,'extreme/salas/'+salaCod), { ofertas });
}
/* distancia de un punto a un segmento: sirve para coger la arista mas cercana */
function distPuntoSegmento(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const L2 = dx*dx + dy*dy;
  if (!L2) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
}

/* ===== LA TASA DE CAMBIO =====
   Sin outpost: 4 por 1. Con un outpost 3:1: 3 por 1. Con el 2:1 de ese
   deporte: 2 por 1. Asi los puertos sirven para algo. */
function tasaDe(s, rid){
  const p = (s.piezas && s.piezas[yo.id]) || {};
  const mios = [...(p.base||[]), ...(p.hub||[])].map(x => x.k);
  let tasa = 4;
  OUTPOSTS.forEach(o => {
    if (!mios.includes(o.k)) return;
    if (o.t === '3:1' && tasa > 3) tasa = 3;
    if (o.t === '2:1' && o.r === rid && tasa > 2) tasa = 2;
  });
  return tasa;
}

/* todas MIS piezas en una lista plana: {t, k, v} */
function piezasDe(s){
  const p = (s.piezas && s.piezas[yo.id]) || {};
  const out = [];
  (p.base  ||[]).forEach(x => out.push({ t:'base',  k:x.k, v:x }));
  (p.hub   ||[]).forEach(x => out.push({ t:'hub',   k:x.k, v:x }));
  (p.camino||[]).forEach(x => { out.push({ t:'camino', k:x.k, v:x }); });
  return out;
}

/* ===== LOS OUTPOSTS (los puertos de Catan) =====
   Van en los cruces del BORDE de la isla. 4 son 3:1 (cambias 3 de cualquiera
   por 1) y 5 son 2:1 de un deporte concreto. Si tienes un Basecamp ahi,
   comercias mejor. */
const TIPOS_OUTPOST = [
  { t:'3:1' }, { t:'2:1', r:'flight' }, { t:'3:1' }, { t:'2:1', r:'board' },
  { t:'3:1' }, { t:'2:1', r:'ride' }, { t:'3:1' }, { t:'2:1', r:'climb' },
  { t:'2:1', r:'jump' },
];
let OUTPOSTS = [];      /* [{ k:'v#x#y', x, y, tipo, r }] */
/* el panal: cruces (V) y aristas (A). Son globales porque los usan tanto el
   tablero como los outposts. */
let V = {}, A = {}, V_OUT = false;
let HEXES = [];      /* los hexagonos de la partida: los usa el bot */

/* reparto los 9 outposts por el borde de la isla, bien separados */
function ponOutposts(){
  const borde = [];
  Object.entries(V).forEach(([k, x]) => {
    if (x.n === 2 && !cercaDelCentro(x)) borde.push({ k, x: x.x, y: x.y });
    if (x.n === 1) borde.push({ k, x: x.x, y: x.y });
  });
  /* me quedo con los del perimetro exterior, separados entre si */
  const cx = CX, cy = CY;
  borde.sort((a,b) => Math.atan2(a.y-cy, a.x-cx) - Math.atan2(b.y-cy, b.x-cx));
  const elegidos = [];
  const sep = Math.min(...(COLS.length > 5 ? [70] : [62]));
  borde.forEach(b => {
    if (elegidos.every(e => Math.hypot(e.x-b.x, e.y-b.y) > sep)) elegidos.push(b);
  });
  /* si salen de mas o de menos, me quedo con 9 repartidos */
  const paso = Math.max(1, Math.floor(elegidos.length / 9));
  const nueve = [];
  for (let i=0; i<elegidos.length && nueve.length<9; i+=paso) nueve.push(elegidos[i]);
  OUTPOSTS = nueve.slice(0,9).map((b, i) => Object.assign({}, b, TIPOS_OUTPOST[i % TIPOS_OUTPOST.length]));
  return OUTPOSTS;
}
function cercaDelCentro(x){ return Math.hypot(x.x-CX, x.y-CY) < Math.min(...COLS)*RY*0.42; }

/* la posicion de cada hexagono en el mapa */
const POS = [];
function posHex(c, i){
  return POS[c*10 + i];
}

/* ===== QUE HEXAGONOS TOCA UN CRUCE =====
   Un cruce del panal toca TRES hexagonos (dos, o uno, en el borde de la isla).
   Antes cada Basecamp guardaba UN SOLO hexagono, asi que solo cobraba de ese:
   los otros dos se perdian y por eso "no daba las tarjetas correctas". Aqui se
   calculan de verdad: los hexagonos cuyo centro esta a R del cruce. */
function hexesDelCruce(k){
  const p = String(k).replace(/^v#/, '').split('#').map(Number);
  if (!isFinite(p[0]) || !isFinite(p[1])) return [];
  const out = [];
  HEXES.forEach((h, i) => {
    const pos = posHex(h.c, h.i);
    if (pos && Math.hypot(pos.cx - p[0], pos.cy - p[1]) < R * 1.08) out.push(i);
  });
  return out;
}
/* cuanto te da ese hexagono: Basecamp suma 1, Hub suma 2 (y si tienes dos
   piezas alrededor, suma las dos) */
function tocaHex(pz, i){
  let n = 0;
  ((pz && pz.base) || []).forEach(b => { if (hexesDelCruce(b.k).includes(i)) n += 1; });
  ((pz && pz.hub)  || []).forEach(b => { if (hexesDelCruce(b.k).includes(i)) n += 2; });
  return n;
}
function calculaPosiciones(){
  COLS.forEach((cuantos,c) => {
    const cx = CX + (c - (COLS.length-1)/2)*RX, y0 = CY - ((cuantos-1)*RY)/2;
    for (let i=0;i<cuantos;i++) POS[c*10+i] = { cx, cy: y0+i*RY };
  });
}

     y el SEGUNDO Basecamp ya cobra los recursos que toca. */
  const orden = [...ids, ...[...ids].reverse()];

/* --- recordar quién eres, para no volver a pedirlo ---
   Se guarda en el propio telefono. Asi, si cierras la app y vuelves, entras solo. */
function recuerda(){ try{ return JSON.parse(localStorage.getItem('extreme_yo')||'null'); }catch(e){ return null; } }
function guarda(x){ try{ localStorage.setItem('extreme_yo', JSON.stringify(x)); }catch(e){} }

const q1 = new URLSearchParams(location.search);
const qCod = (q1.get('s')||'').toUpperCase();
const qNom = q1.get('n'), qCol = q1.get('c');

async function entrarDirecto(cod, nombre, color){
  const s = await leerSala(cod);
  if (!s) return false;
  const js = s.jugadores || {};
  /* si ya estas dentro, entras con tu misma ficha */
  const mio = Object.entries(js).find(([id,j]) => j.nombre === nombre);
  if (mio){
    yo = { id: mio[0], nombre, color: mio[1].color };
    esAnfitrion = (s.anfitrion === mio[0]);
    registraDesconexion(cod, mio[0]);
  } else {
    const libres = COLORES.map(c=>c.id).filter(c => !Object.values(js).some(j=>j.color===c));
    const col = (color && libres.includes(color)) ? color : libres[0];
    if (!col) return false;
    const id = 'j' + Date.now() + Math.floor(Math.random()*99);
    yo = { id, nombre, color: col };
    await set(ref(db,'extreme/salas/'+cod+'/jugadores/'+id), { nombre, color: col });
    registraDesconexion(cod, id);
    esAnfitrion = (s.anfitrion === id);
  }
  guarda({ cod, id: yo.id, nombre: yo.nombre });
  salaCod = cod; escuchar(cod);
  return true;
}

/* 1) si el link trae todo (?s=COD&n=Tu&c=rojo), entras directo */
if (qCod.length === 4 && qNom){
  entrarDirecto(qCod, qNom, qCol).then(ok => { if (!ok) pant('p2'); });
}
/* 2) si ya jugaste antes en este telefono, vuelves solo a tu sala */
else if (qCod.length === 4){
  leerSala(qCod).then(s => {
    const guardado = recuerda();
    if (s && guardado && guardado.cod === qCod && s.jugadores && s.jugadores[guardado.id]){
      yo = { id: guardado.id, nombre: guardado.nombre, color: s.jugadores[guardado.id].color };
      esAnfitrion = (s.anfitrion === guardado.id);
      salaCod = qCod; escuchar(qCod);
    } else if (guardado && guardado.nombre){
      /* Tu ficha ya no esta en la sala: el onDisconnect te quita cuando cierras
         la app. Antes te dejaba fuera (portada) y parecia que "no te dejaba
         entrar". Ahora vuelves a entrar solo, con tu mismo nombre. */
      entrarDirecto(qCod, guardado.nombre, null).then(ok => {
        if (ok) return;
        $('inCod').value = qCod; pant('p2');
        if (s){
          const occ = Object.values(s.jugadores||{}).map(j => j.color);
          const e2 = c => { window._c2 = c; pintaAro('aro2', occ, c, e2); };
          pintaAro('aro2', occ, null, e2);
        }
      });
    } else {
      $('inCod').value = qCod; pant('p2');
      if (s){
        const occ = Object.values(s.jugadores||{}).map(j => j.color);
        const e2 = c => { window._c2 = c; pintaAro('aro2', occ, c, e2); };
        pintaAro('aro2', occ, null, e2);
      }
    }
  });
}
/* 3) sin codigo: a la portada */
else {
  const guardado = recuerda();
  if (guardado && guardado.cod){
    leerSala(guardado.cod).then(s => {
      if (s && s.jugadores && s.jugadores[guardado.id]){
        yo = { id: guardado.id, nombre: guardado.nombre, color: s.jugadores[guardado.id].color };
        esAnfitrion = (s.anfitrion === guardado.id);
        salaCod = guardado.cod; escuchar(guardado.cod);
      } else if (s && guardado.nombre){
        /* Ya no estas en la sala (el onDisconnect te quito al cerrar la app).
           Vuelve a entrar solo con tu nombre, en vez de quedarte en la portada. */
        entrarDirecto(guardado.cod, guardado.nombre, null).catch(() => {});
      }
    });
  }
}
