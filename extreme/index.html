<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EXTREME</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1209">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{--oro:#e8c87a;--oro2:#a8802f;--crema:#f2e8d5;--dim:#a98f68}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding-top:env(safe-area-inset-top,0px);color:var(--crema);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;min-height:100vh;overflow-x:hidden}
  body{background-color:#1a1209;background-image:url('cuero.jpg');
    background-size:240px auto;background-repeat:repeat;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 30%, rgba(26,17,9,.18) 0%,
      rgba(14,9,4,.55) 60%, rgba(8,5,2,.78) 100%)}
  .env{position:relative;z-index:2;max-width:420px;margin:0 auto;padding:16px 16px 0}

  /* ===== LA ROSA DE LOS VIENTOS, grande y detras ===== */
  .brujula-fondo{position:absolute;left:50%;width:118%;max-width:520px;aspect-ratio:1;
    transform:translateX(-50%);pointer-events:none;z-index:1;opacity:.16}
  .brujula-fondo svg{width:100%;height:100%;display:block}

  /* ===== LOGO tallado ===== */
  header{text-align:center;position:relative;padding:14px 0 4px}
  header .esc{display:flex;align-items:center;justify-content:center;gap:15px}
  header h1{margin:0;font-family:'Anton',sans-serif;font-size:40px;letter-spacing:2.5px;
    background:linear-gradient(180deg,#fff6de 0%,#e6c88a 30%,#b08a3c 55%,#7a5a1c 78%,#c9a558 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 rgba(60,40,10,.9)) drop-shadow(0 3px 3px rgba(0,0,0,.75))
      drop-shadow(0 0 14px rgba(232,200,122,.22))}
  header .sub{font-size:8.5px;letter-spacing:3.4px;color:#c9a558;font-weight:800;
    margin-top:8px;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  .esc .ic{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.8))}

  .pant{display:none}.pant.on{display:block;position:relative}

  /* ===== ROTULO biselado con remaches ===== */
  .rotul{display:inline-block;position:relative;padding:7px 26px;border-radius:5px;
    font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#2b1f07;
    background-image:url('laton.jpg');background-size:cover;background-position:center;
    border:1px solid rgba(90,66,20,.9);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    box-shadow:0 1px 0 rgba(255,250,225,.65) inset, 0 -2px 6px rgba(60,38,5,.5) inset,
      0 2px 5px rgba(0,0,0,.65);text-shadow:0 1px 0 rgba(255,250,220,.55)}
  .rotul::before,.rotul::after{content:'';position:absolute;top:50%;width:5px;height:5px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0c8,#8a6a24);
    transform:translateY(-50%);box-shadow:0 1px 2px rgba(0,0,0,.7)}
  .rotul::before{left:9px}.rotul::after{right:9px}
  .etiq{text-align:center;margin:16px 0 7px}

  /* ===== EL CAMPO: panel de MADERA con marco dorado ===== */
  input{width:100%;border-radius:13px;padding:16px;font-size:17px;font-family:inherit;
    background-color:#4a3520;background-image:url('madera.jpg');
    background-size:cover;background-position:center;background-blend-mode:normal;
    border:none;color:#f0e2c4;margin:0;text-align:center;outline:none;
    box-shadow:0 0 0 3px #6d4f14, 0 0 0 5px #c9a558, 0 0 0 6.5px #2a1d09,
      0 2px 0 rgba(255,235,200,.22) inset, 0 -5px 14px rgba(0,0,0,.62) inset,
      0 5px 14px rgba(0,0,0,.55);
    text-shadow:0 2px 3px rgba(0,0,0,.8)}
  input:focus{box-shadow:0 0 0 3px #8a6a24, 0 0 0 5.5px #f0d899, 0 0 0 7px #2a1d09,
    0 2px 0 rgba(255,235,200,.28) inset, 0 -5px 14px rgba(0,0,0,.62) inset,
    0 0 20px rgba(232,200,122,.4)}
  input::placeholder{color:#c2a878}
  input.codigo{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:9px;text-transform:uppercase}

  /* ===== LOS MEDALLONES, EN CIRCULO sobre la brujula ===== */
  .aro{position:relative;width:100%;max-width:330px;margin:8px auto 0;aspect-ratio:1}
  .aro .centro{position:absolute;left:50%;top:50%;width:112%;height:112%;
    transform:translate(-50%,-50%);pointer-events:none;opacity:.5}
  .aro .centro svg{width:100%;height:100%;display:block}
  .med{position:absolute;width:88px;height:88px;border-radius:50%;cursor:pointer;
    transform:translate(-50%,-50%) scale(1);transition:transform .15s;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:0 0 0 3px #2a1d12, 0 0 0 6px #c9a558, 0 0 0 8px #3a2a10,
      0 6px 14px rgba(0,0,0,.7), 0 0 16px rgba(201,165,88,.22)}
  .med img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .med .velo{position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 34% 26%, rgba(255,255,255,.28), transparent 55%)}
  .med .col{position:absolute;inset:0;border-radius:50%;mix-blend-mode:soft-light}
  .med:active{transform:translate(-50%,-50%) scale(.94)}
  .med.sel{transform:translate(-50%,-50%) scale(1.17);
    box-shadow:0 0 0 3px #2a1d12, 0 0 0 7px #f0d899, 0 0 0 9px #6d4f14,
      0 0 24px rgba(240,216,153,.8), 0 8px 18px rgba(0,0,0,.7)}
  .med.ocupado{opacity:.25;pointer-events:none;filter:grayscale(.8)}
  /* 6 posiciones en circulo */
  .med.p0{left:50%;top:6%}
  .med.p1{left:88%;top:29%}
  .med.p2{left:88%;top:72%}
  .med.p3{left:50%;top:95%}
  .med.p4{left:12%;top:72%}
  .med.p5{left:12%;top:29%}

  /* ===== EL CINTURON CLARO con cosido y hebilla ===== */
  .btn{width:100%;border:none;border-radius:8px;padding:17px 66px 17px 20px;cursor:pointer;
    font-family:'Anton',sans-serif;font-size:16px;letter-spacing:1.6px;color:#2a1d06;
    margin-top:13px;position:relative;text-align:center;
    background-image:url('laton.jpg');background-size:180px auto;background-position:center;
    background-color:#d8b878;background-blend-mode:screen;
    box-shadow:0 2px 0 rgba(255,250,225,.75) inset, 0 -4px 10px rgba(70,48,10,.45) inset,
      0 5px 0 #5a4212, 0 8px 16px rgba(0,0,0,.62);
    text-shadow:0 1px 0 rgba(255,250,225,.65)}
  /* el cosido de los bordes */
  .btn::before{content:'';position:absolute;inset:4px;border-radius:5px;pointer-events:none;
    border:1.5px dashed rgba(90,66,20,.55)}
  /* la hebilla */
  .btn::after{content:'';position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:31px;height:31px;border-radius:7px;
    background-image:url('laton.jpg');background-size:cover;
    border:2px solid #c9a558;
    box-shadow:0 1px 0 rgba(255,250,225,.8) inset, 0 -3px 6px rgba(60,38,5,.6) inset,
      0 3px 6px rgba(0,0,0,.7)}
  .btn:active{transform:translateY(3px);
    box-shadow:0 2px 0 rgba(255,250,225,.6) inset, 0 -4px 10px rgba(70,48,10,.55) inset,
      0 2px 0 #5a4212, 0 4px 9px rgba(0,0,0,.6)}
  .btn.alt{background-image:url('laton.jpg');background-size:220px auto;
    background-position:center;background-color:#d8b878;background-blend-mode:screen;
    color:#2a1d06;font-size:14px;padding:13px 56px 13px 16px;
    text-shadow:0 1px 0 rgba(255,252,235,.85);
    box-shadow:0 1px 0 rgba(255,250,225,.7) inset, 0 -3px 8px rgba(70,48,10,.45) inset,
      0 3px 0 #4a3410, 0 5px 11px rgba(0,0,0,.55)}
  .btn.alt::after{width:23px;height:23px;right:14px;border-width:1.5px}
  .btn:disabled{opacity:.5;filter:saturate(.6)}

  .pie{text-align:center;font-size:10px;color:var(--dim);margin-top:15px;line-height:1.6;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}

  /* el codigo de sala, sobre madera */
  .sala{background-image:url('madera.jpg');background-size:cover;background-position:center;
    border-radius:15px;padding:16px;text-align:center;margin-bottom:12px;
    box-shadow:0 3px 0 rgba(255,235,200,.22) inset, 0 -6px 16px rgba(0,0,0,.62) inset,
      0 0 0 3px #1a1009, 0 0 0 5px rgba(201,165,88,.55), 0 8px 20px rgba(0,0,0,.6)}
  .sala .cod{font-family:'Anton',sans-serif;font-size:46px;letter-spacing:12px;padding-left:12px;
    background:linear-gradient(180deg,#fff6de,#c9a558 60%,#8f6f2c);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.85))}
  .sala .mini{font-size:10px;color:#c2a878;text-shadow:0 1px 2px rgba(0,0,0,.8)}

  .jug{display:flex;align-items:center;gap:11px;border-radius:12px;padding:10px 13px;margin-bottom:7px;
    background-image:url('madera.jpg');background-size:cover;background-position:center 45%;
    box-shadow:0 1px 0 rgba(255,235,200,.18) inset, 0 -4px 10px rgba(0,0,0,.55) inset,
      0 0 0 2px #1a1009, 0 0 0 3.5px rgba(201,165,88,.5), 0 4px 9px rgba(0,0,0,.5)}
  .jug .p{width:26px;height:26px;border-radius:50%;flex:0 0 auto;overflow:hidden;
    box-shadow:0 0 0 2px #2a1d12, 0 0 0 3.5px #c9a558}
  .jug .p img{width:100%;height:100%;object-fit:cover}
  .jug .n{font-weight:800;font-size:14.5px;flex:1;text-shadow:0 2px 3px rgba(0,0,0,.8)}
  .jug .y{font-size:8.5px;font-weight:800;letter-spacing:1px;color:#2a1d06;
    background-image:url('laton.jpg');background-size:cover;border-radius:20px;padding:3px 9px}
  .vacio{text-align:center;font-size:12px;color:var(--dim);padding:12px;text-shadow:0 1px 3px rgba(0,0,0,.8)}

  /* la brujula de la esquina */
  .brujula-esq{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    width:74px;height:74px;z-index:3;pointer-events:none;opacity:.9;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.7))}

  .err{background:rgba(120,30,20,.55);border:1px solid rgba(220,120,90,.7);color:#ffd5c8;
    border-radius:9px;padding:10px;font-size:12px;text-align:center;margin-top:10px;display:none;
    text-shadow:0 1px 2px rgba(0,0,0,.8)}
  .err.on{display:block}

  /* ===== LA PARTIDA (Fase 2): el tablero compartido ===== */
  .barra{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
  .barra .j{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:22px;
    background-image:url('madera.jpg');background-size:cover;background-position:center;
    font-size:11.5px;font-weight:800;color:#f0e2c4;
    text-shadow:0 1px 2px rgba(0,0,0,.9);
    box-shadow:0 0 0 2px #1a1009, 0 0 0 3.5px rgba(201,165,88,.5)}
  .barra .j.act{box-shadow:0 0 0 2px #1a1009, 0 0 0 4.5px #f0d899, 0 0 18px rgba(240,216,153,.75)}
  .barra .j img{width:23px;height:23px;border-radius:50%;display:block}
  .turno{text-align:center;font-size:12.5px;color:#e8c87a;font-weight:800;margin-bottom:10px;
    text-shadow:0 2px 4px rgba(0,0,0,.95)}
  .mapa{width:100%;display:block;position:relative;margin:2px 0 0}
  .mapa svg{width:100%;display:block;max-height:62vh}
  .fichaInfo{margin-top:10px;font-size:12px;color:#e8dcc0;text-align:center;line-height:1.55;
    min-height:34px;text-shadow:0 2px 4px rgba(0,0,0,.95)}
  .fichaInfo b{color:#f0d899}
  .hex{cursor:pointer}
  /* Que respiren SIN moverse de sitio: animar el transform en SVG desplaza el
     circulo y entonces el dedo no acierta a tocarlo. Solo cambia la opacidad. */
  .toque{pointer-events:all;cursor:pointer;animation:latido 1.4s ease-in-out infinite}
  @keyframes latido{0%,100%{opacity:.6}50%{opacity:1}}
  .toque{cursor:pointer}
  .hex:active{opacity:.82}
  .nofly path{stroke-dasharray:5 4}

  /* ===== TUS RECURSOS ===== */
  .recursos{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:11px}
  .recursos .r{display:flex;align-items:center;gap:5px;padding:4px 10px 4px 4px;border-radius:20px;
    background-image:url('madera.jpg');background-size:cover;background-position:center;
    font-size:11.5px;font-weight:800;color:#f0e2c4;text-shadow:0 1px 2px rgba(0,0,0,.9);
    box-shadow:0 0 0 2px #1a1009, 0 0 0 3.5px rgba(201,165,88,.5)}
  .recursos .r img{width:21px;height:21px;border-radius:50%;display:block}
  .recursos .r b{color:#f0d899;font-size:13px}
  .recursos .r.gris{opacity:.4}

  /* ===== LOS BOTONES DE ACCION ===== */
  .acciones{margin-top:13px}
  .filaBotones{display:flex;gap:8px;margin-top:11px}
  .btn.chico{flex:1;font-size:12px;padding:14px 6px;margin-top:0;letter-spacing:.8px}
  .btn.chico .ct{display:block;font-size:9px;letter-spacing:0;opacity:.75;margin-top:2px}
  .btn.chico.on{box-shadow:0 0 0 3px #f0d899, 0 3px 0 #5a4212, 0 0 20px rgba(240,216,153,.8);
    transform:translateY(-1px)}
  .btn.dad{font-size:17px;margin-top:0}

  /* ===== EL AVISO (dados, recursos, fallos) ===== */
  .aviso{position:fixed;inset:0;background:rgba(8,5,2,.75);display:none;
    align-items:center;justify-content:center;z-index:50;padding:26px}
  .aviso.on{display:flex}
  .aviso .caja{background-color:#2a1d12;background-image:url('madera.jpg');
    background-size:cover;background-position:center;border-radius:16px;padding:24px 20px;
    max-width:310px;width:100%;text-align:center;font-size:14.5px;line-height:1.65;
    color:#f0e2c4;text-shadow:0 2px 4px rgba(0,0,0,.95);
    box-shadow:0 0 0 3px #1a1009, 0 0 0 6px #c9a558, 0 14px 34px rgba(0,0,0,.85)}
  .aviso .caja b{color:#f0d899;font-size:20px;display:block;margin-bottom:6px}

  /* ===== LAS TARJETAS DE RECURSO (las que hicimos) ===== */
  .recursos{display:flex;gap:3px;justify-content:center;margin:7px 0 9px}
  .cartaRec{position:relative;width:52px;flex:0 1 auto;transition:transform .14s}
  .cartaRec img{width:100%;display:block;border-radius:4px;
    box-shadow:0 2px 5px rgba(0,0,0,.75), 0 0 0 1px rgba(201,165,88,.5)}
  .cartaRec b{position:absolute;right:-4px;bottom:-5px;background:#1a1009;color:#f0d899;
    border-radius:50%;width:19px;height:19px;display:flex;align-items:center;
    justify-content:center;font-size:11px;box-shadow:0 0 0 1.5px #c9a558}
  .cartaRec.vacia img{filter:grayscale(1) brightness(.45)}
  .cartaRec.vacia b{color:#8a8178;box-shadow:0 0 0 1.5px #6b6255}

  /* y en el comercio, las cartas grandes */
  .pcRecs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
  .cartaPC{position:relative;width:44px;cursor:pointer;transition:transform .12s;opacity:.4}
  .cartaPC.on{opacity:1;transform:translateY(-4px)}
  .cartaPC img{width:100%;display:block;border-radius:4px;
    box-shadow:0 2px 5px rgba(0,0,0,.7), 0 0 0 1px rgba(201,165,88,.45)}
  .cartaPC.on img{box-shadow:0 0 0 2px #f0d899, 0 0 12px rgba(240,216,153,.8)}
  .cartaPC .n{position:absolute;right:-4px;bottom:-4px;background:#1a1009;color:#f0d899;
    border-radius:50%;width:17px;height:17px;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:800;box-shadow:0 0 0 1.5px #c9a558}

  /* ===== LOS DADOS, A LA VISTA DE TODOS ===== */
  .dadosVista{display:none;justify-content:center;align-items:center;gap:7px;margin:1px 0 9px}
  .dadosVista.on{display:flex}
  .dadosVista .dd{width:27px;height:27px;border-radius:6px;background:#f6f1e2;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:3px;gap:1px;box-shadow:0 2px 5px rgba(0,0,0,.65), inset 0 -2px 0 rgba(0,0,0,.14)}
  .dadosVista .dd i{background:#2a2118;border-radius:50%;display:block}
  .dadosVista .dtot{font-family:'Anton',sans-serif;font-size:20px;color:#f0d899;
    margin-left:4px;text-shadow:0 2px 4px rgba(0,0,0,.95)}
  .dadosVista .dq{font-size:9.5px;color:#c9a558;text-transform:uppercase;
    letter-spacing:.9px;font-weight:800;margin-left:2px;text-shadow:0 1px 2px rgba(0,0,0,.9)}

  /* el numero de turno, para saber el orden */
  .barra .j .ord{background:#1a1009;color:#f0d899;border-radius:50%;width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;
    box-shadow:0 0 0 1px rgba(201,165,88,.65);flex:0 0 auto}

  /* ===== EL COMERCIO ===== */
  .panel{position:fixed;inset:0;background:rgba(8,5,2,.82);display:none;
    align-items:center;justify-content:center;z-index:60;padding:18px}
  .panel.on{display:flex}
  .pc{background-color:#2a1d12;background-image:url('madera.jpg');background-size:cover;
    background-position:center;border-radius:16px;padding:20px 16px;max-width:350px;width:100%;
    box-shadow:0 0 0 3px #1a1009, 0 0 0 6px #c9a558, 0 14px 34px rgba(0,0,0,.85)}
  .pc h3{margin:0 0 15px;text-align:center;font-family:'Anton',sans-serif;font-size:18px;
    color:#f0d899;letter-spacing:1.2px;text-shadow:0 2px 4px rgba(0,0,0,.9)}
  .pcFila{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:15px}
  .pcLado{flex:1;text-align:center}
  .pcT{font-size:9px;font-weight:800;letter-spacing:1.4px;color:#c9a558;margin-bottom:7px;
    text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.9)}
  .pcFlecha{font-size:19px;color:#c9a558}
  .pcRecs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .pcRecs .r{width:36px;height:36px;border-radius:50%;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:.34;transition:transform .12s;
    box-shadow:0 0 0 2px #1a1009, 0 0 0 3.5px rgba(201,165,88,.45)}
  .pcRecs .r.on{opacity:1;transform:scale(1.12);
    box-shadow:0 0 0 2px #1a1009, 0 0 0 4px #f0d899, 0 0 15px rgba(240,216,153,.75)}
  .pcRecs .r img{width:100%;height:100%;border-radius:50%;display:block}
  .pcRecs .r .n{position:absolute;bottom:-5px;right:-4px;background:#2a1d12;border-radius:10px;
    font-size:10px;font-weight:800;color:#f0d899;padding:0 4px;border:1px solid rgba(201,165,88,.5)}
  .pcBtns{display:flex;gap:8px;margin-bottom:0}
  .pcBtns .btn{margin-top:0}
  .pcBtns .btn.chico{flex:0 0 auto;font-size:10.5px}
  .pcBtns .btn:last-child{flex:1}

  /* las ofertas que hay en la mesa */
  .oferta{border-radius:12px;padding:10px 12px;margin-top:10px;
    background-image:url('madera.jpg');background-size:cover;background-position:center;
    box-shadow:0 0 0 2px #1a1009, 0 0 0 3.5px rgba(201,165,88,.5);
    font-size:12px;color:#f0e2c4;text-shadow:0 1px 2px rgba(0,0,0,.9)}
  .oferta .quien{font-weight:800;color:#f0d899}
  .oferta .cambio{margin:5px 0 9px;line-height:1.55}
  .oferta .cambio b{color:#fff}
  .oferta .bb{display:flex;gap:7px}
  .oferta .bb button{flex:1;border:none;border-radius:8px;padding:9px;font-family:'Anton',sans-serif;
    font-size:12px;letter-spacing:.5px;cursor:pointer}
  .oferta .si{background:linear-gradient(180deg,#79b93a,#3d7016);color:#fff}
  .oferta .no{background:linear-gradient(180deg,#8a8178,#4a453e);color:#f0e2c4}
  .oferta .mia{font-size:11px;color:#c9a558;text-align:center}
  /* ===== LA GUIA: que terreno da que recurso (cerrada no ocupa nada) ===== */
  .guia{margin:9px auto 0;max-width:344px;background:rgba(26,16,9,.78);
    border-radius:11px;box-shadow:0 0 0 1.5px rgba(201,165,88,.42);overflow:hidden}
  .guia summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:12px;

<script type="module">
/* ==========================================================================
   EXTREME — Fase 1: la sala
   Medallones EN CIRCULO alrededor de la rosa de los vientos, hechos con las
   ilustraciones del juego. Materiales: cuero (fondo), madera (campos), laton.
   ========================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, onDisconnect, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({ databaseURL: "https://plan-gym-8aff7-default-rtdb.firebaseio.com" });
const db  = getDatabase(app);

/* las 6 ilustraciones del juego (las tarjetas), una por color */
/* LOS MEDALLONES de Pam: cada color lleva su ilustracion en cristal, con su
   marco de metal. Van DENTRO del aro dorado que dibuja la app. */
const COLORES = [
  { id:'rojo',    n:'Rojo',    c:'#d24c3a', img:'arte/med_1.png' },  // parapente sobre las crestas
  { id:'azul',    n:'Azul',    c:'#4a9fd8', img:'arte/med_3.png' },  // el refugio nevado
  { id:'verde',   n:'Verde',   c:'#6fb04a', img:'arte/med_5.png' },  // enduro en el bosque
  { id:'morado',  n:'Morado',  c:'#a878e0', img:'arte/med_2.png' },  // la nube y el rayo
  { id:'marron',  n:'Marrón',  c:'#c99a5e', img:'arte/med_4.png' },  // la torre y el aguila
  { id:'gris',    n:'Gris',    c:'#a8a49c', img:'arte/med_6.png' },  // las tiendas bajo la luna
];

/* Los RECURSOS son los 5 deportes. OJO: no son los COLORES de jugador
   (que son rojo/azul/verde...). Antes los mezclaba y por eso los contadores
   salian siempre a 0. */
const RECURSOS = [
  { id:'flight', n:'FLIGHT', mini:'arte/mini_flight.jpg', carta:'arte/carta_flight.jpg' },
  { id:'board',  n:'BOARD',  mini:'arte/mini_board.jpg',  carta:'arte/carta_board.jpg'  },
  { id:'ride',   n:'RIDE',   mini:'arte/mini_ride.jpg',   carta:'arte/carta_ride.jpg'   },
  { id:'climb',  n:'CLIMB',  mini:'arte/mini_climb.jpg',  carta:'arte/carta_climb.jpg'  },
  { id:'jump',   n:'JUMP',   mini:'arte/mini_jump.jpg',   carta:'arte/carta_jump.jpg'   },
];

const $ = id => document.getElementById(id);
const pant = n => ['p1','p2','p3','p4','p5'].forEach(p => $(p).classList.toggle('on', p === n));
const err = (id, txt) => { const e = $(id); e.textContent = txt; e.classList.add('on');
                            setTimeout(() => e.classList.remove('on'), 3600); };
let yo = null, salaCod = null, esAnfitrion = false, oyente = null;

/* la brujula que va DETRAS de los medallones */
const ROSA = `<svg viewBox="0 0 200 200"><g fill="none" stroke="#e8c87a" stroke-width="1.5">
  <circle cx="100" cy="100" r="94"/><circle cx="100" cy="100" r="78" stroke-width="1"/>
  <circle cx="100" cy="100" r="60"/><circle cx="100" cy="100" r="30" stroke-width="1"/>
  <path d="M100 2 L108 92 L198 100 L108 108 L100 198 L92 108 L2 100 L92 92 Z"/>
  <path d="M40 40 L88 88 M160 40 L112 88 M160 160 L112 112 M40 160 L88 112"/>
  <path d="M100 26 L105 95 L174 100 L105 105 L100 174 L95 105 L26 100 L95 95 Z"/>
  </g></svg>`;

function pintaAro(cont, ocupados, elegido, alElegir){
  const el = $(cont);
  el.innerHTML = `<div class="centro">${ROSA}</div>` + COLORES.map((c,i) => {
    const occ = ocupados.includes(c.id), sel = c.id === elegido ? ' sel' : '';
    return `<div class="med p${i}${occ?' ocupado':''}${sel}" data-c="${c.id}">
      <img src="${c.img}" alt="">
      </div>`;
  }).join('');
  el.querySelectorAll('.med').forEach(m => m.onclick = () => alElegir(m.dataset.c));
}

function nuevoCodigo(){
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = ''; for (let i=0;i<4;i++) s += abc[Math.floor(Math.random()*abc.length)];
  return s;
}
async function leerSala(cod){
  const snap = await get(ref(db, 'extreme/salas/' + cod));
  return snap.exists() ? snap.val() : null;
}

function escuchar(cod){
  if (oyente) oyente();
  oyente = onValue(ref(db, 'extreme/salas/' + cod), snap => {
    const s = snap.val();
    if (!s){ pant('p1'); return; }

    /* ===== QUE NUNCA TE DEJE FUERA =====
       Si vuelves a entrar, el juego te da un id nuevo, y entonces el turno
       apunta a tu id viejo: parecia que no te dejaba jugar. Aqui, si tu id ya
       no esta pero tu NOMBRE si, adoptas esa ficha y sigues jugando. */
    if (yo && s.jugadores && !s.jugadores[yo.id]){
      const mio = Object.entries(s.jugadores).find(([id,j]) => j.nombre === yo.nombre);
      if (mio){
        yo.id = mio[0];
        yo.color = mio[1].color || yo.color;
        esAnfitrion = (s.anfitrion === yo.id);
        guarda({ cod, id: yo.id, nombre: yo.nombre });
      } else {
        /* tu ficha no esta y tu nombre tampoco: vuelve a entrar como un piloto nuevo */
        const libres = COLORES.map(c=>c.id).filter(c => !Object.values(s.jugadores).some(j=>j.color===c));
        if (libres.length){
          yo.color = libres[0];
          set(ref(db,'extreme/salas/'+cod+'/jugadores/'+yo.id), { nombre: yo.nombre, color: yo.color });
          registraDesconexion(cod, yo.id);
        }
        /* repinto en cuanto mi ficha nueva este guardada (sin recargar) */
        setTimeout(() => leerSala(cod).then(x => { if (x) pintaPartida(x); }), 800);
        return;
      }
    }

    /* ===== SESION PERSISTENTE =====
       Si la partida YA EMPEZO, nadie se va de la mesa por salir de la pagina
       (basta con ir a contestar un mensaje). Aqui cancelo mi aviso de
       desconexion: me quedo sentado y al volver estoy justo donde estaba.
       En el vestibulo SI se limpia, para que no se llene de gente que nunca
       llego a jugar. */
    if (miDesconexion && s.fase && s.fase !== 'lobby'){
      try { miDesconexion.cancel(); } catch(e){}
      miDesconexion = null;
    }

    /* ===== SI EL ANFITRION SE FUE, OTRO TOMA EL MANDO =====
       Al cerrar la app, el onDisconnect te borra de la sala. Si el que se iba
       era el ANFITRION, la sala se quedaba sin nadie que pudiera pulsar
       EMPEZAR: parecia que el boton "no hacia nada". Aqui, el que lleva mas
       tiempo presente pasa a ser anfitrion. */
    if (s.jugadores && s.anfitrion && !s.jugadores[s.anfitrion]){
      const presentes = Object.keys(s.jugadores);
      if (presentes.length){
        const clave = x => { const m = String(x).replace(/\D/g,'').slice(0,13); return parseInt(m,10) || 0; };
        const nuevo = presentes.slice().sort((a,b) => clave(a) - clave(b))[0];
        update(ref(db,'extreme/salas/'+cod), { anfitrion: nuevo });
        s.anfitrion = nuevo;
      }
    }
    /* y mi mando, siempre al dia (puede haber cambiado) */
    esAnfitrion = (s.anfitrion === yo.id);

    /* ===== EL TURNO TIENE QUE SER DE ALGUIEN QUE ESTA =====
       Si alguien sale de la sala (o vuelve con otro id), su id se queda dentro
       del orden y el turno puede caer en un FANTASMA. Entonces la partida se
       paraba y parecia que "ya no te deja jugar". Aqui el orden se rehace con
       los que estan de verdad y el turno salta al siguiente vivo. */
    if (s.jugadores && (s.fase === 'colocando' || s.fase === 'juego')){
      const presentes = Object.keys(s.jugadores);
      const ord = (s.orden || []).slice();
      const upd = {};

      /* ===== OJO: EL ORDEN **NO** SE REHAZ =====
         El turno sale de orden[Math.floor(colocadoEn/2) % orden.length]. Si el
         orden cambia de tamano o de orden en mitad de la colocacion, los turnos
         se descuadran: unos ponen TRES Basecamps y otros solo uno. Por eso aqui
         NO se rehace: el que se fue deja su hueco, y el que vuelve (o entra
         nuevo) OCUPA ESE HUECO, en el mismo sitio. Asi los turnos cuadran. */
      if (ord.length === presentes.length * 2){
        const faltan = presentes.filter(id => !ord.includes(id));
        if (faltan.length){
          faltan.forEach(id => {
            const hueco = ord.findIndex(x => !presentes.includes(x));
            if (hueco >= 0) ord[hueco] = id;
          });
          upd.orden = ord;
        }
      }

      /* y el turno tiene que ser de alguien que este de verdad */
      if (!presentes.includes(s.turno)){
        const viejo = s.orden || [];
        const i = viejo.indexOf(s.turno);
        let sig = null;
        for (let k = 1; k <= viejo.length && !sig; k++){
          const cand = viejo[(i + k + viejo.length) % viejo.length];
          if (presentes.includes(cand)) sig = cand;
        }
        upd.turno = sig || presentes[0];
        upd.colocPaso = null;
      }

      if (Object.keys(upd).length){
        update(ref(db,'extreme/salas/'+cod), upd);
        /* y sigo con los datos nuevos YA (sin esperar al servidor), para que la
           pantalla se pinte al momento y no haya que recargar */
        if (upd.orden) s.orden = upd.orden;
        if (upd.turno) s.turno = upd.turno;
        if ('colocPaso' in upd) s.colocPaso = upd.colocPaso;
      }
    }

    /* ===== SI LA PARTIDA QUEDO A MEDIAS, SE ARREGLA SOLA =====
       Paso si alguien pulsaba EMPEZAR con el juego a medio cargar (caché vieja):
       la sala quedaba en 'juego' o 'colocando' pero SIN tablero y SIN turno, y
       entonces no avanzaba a ningun lado. Si falta el tablero, el anfitrion la
       reparte de nuevo limpia. */
    if ((s.fase === 'juego' || s.fase === 'colocando') && (!s.hexes || !s.orden || !s.turno)){
      if (esAnfitrion){
        const idsR = Object.keys(s.jugadores || {});
        if (idsR.length >= 2){
          const ordenR = [...idsR, ...[...idsR].reverse()];
          const recR = {}, paR = {};
          idsR.forEach(id => { recR[id] = { flight:0, board:0, ride:0, climb:0, jump:0 }; paR[id] = 0; });
          const hsR = crearTablero(idsR.length);
          update(ref(db,'extreme/salas/'+cod), {
            fase:'colocando', empezada:Date.now(), hexes: hsR,
            recursos: recR, pa: paR, piezas:{}, dados:null,
            orden: ordenR, colocadoEn: 0, colocPaso: null, turno: ordenR[0]
          });
          /* sigo con los datos nuevos, para que se pinte YA (sin recargar) */
          s.fase = 'colocando'; s.hexes = hsR; s.recursos = recR; s.pa = paR;
          s.piezas = {}; s.dados = null; s.orden = ordenR;
          s.colocadoEn = 0; s.colocPaso = null; s.turno = ordenR[0];
        }
      }
      if (!s.hexes || !s.orden || !s.turno) return;   /* si no se pudo, no pinto */
    }

    /* ===== NO PINTO MIENTRAS JUEGA UN BOT =====
       El bot juega cambiando "yo" un momento. Si pintara ahora, la pantalla
       saldria con SU identidad: te diria "Colocando Bot…" y no te dejaria
       tocar aunque el turno fuera tuyo. Esto paso de verdad con Pam. */
    if (botOcupado) return;

    /* si la partida ya empezo, todos a la mesa con el MISMO tablero */
    if (s.fase === 'juego' || s.fase === 'colocando'){
      pant('p5');
      if (s.hexes) pintaTablero(s.hexes);
      /* en la colocacion inicial, el modo lo manda el juego, no tu */
      /* ===== SI LE TOCA A UN BOT, LO MUEVE QUIEN ESTE MIRANDO ===== */
      mueveElBot(s);

      if (s.fase === 'colocando' && s.turno === yo.id){
        const quiero = s.colocPaso || 'base';
        if (modo !== quiero){ modo = quiero; }
      } else if (s.fase === 'juego' && modo){
        /* ===== SOLTAR EL MODO DE LA COLOCACION =====
           Al empezar la partida el modo se quedaba encendido por dentro, pero
           el boton se veia APAGADO. Entonces tu primer toque en RUTA o
           BASECAMP lo APAGABA en vez de encenderlo, y no salia ningun punto:
           "me dice que voy y no me deja". */
        modo = null;
        ['bCamino','bBase','bHub'].forEach(b => $(b).classList.remove('on'));
        $('info').innerHTML = '';
      }
      /* PRIMERO las posiciones y DESPUES pintar: los puntos para tocar salen
         de POS, asi que si pinto antes de calcularlas no hay ningun punto. */
      calculaPosiciones();
      pintaPartida(s);
      return;
    }

    /* ===== LA SALA =====
       Si la partida aun no ha empezado, la pantalla es LA SALA (p4). Sin esto,
       al entrar por el link o al recargar te quedabas en la PORTADA: no veias
       la lista de pilotos ni el boton de anadir bots, y parecia que "no te
       dejaba" hacer nada. */
    pant('p4');
    const lista = Object.entries(s.jugadores || {}).map(([id,j]) => ({ id, ...j }));
    $('codGrande').textContent = cod;
    $('cuantos').textContent = lista.length === 1 ? 'esperando pilotos…' : lista.length + ' pilotos';
    $('lista').innerHTML = lista.length ? lista.map(j => {
      const col = COLORES.find(c => c.id === j.color) || COLORES[0];
      return `<div class="jug">
        <span class="p"><img src="${col.img}" alt=""></span>
        <span class="n">${(j.nombre||'').replace(/[<>]/g,'')}</span>
        ${j.id === s.anfitrion ? '<span class="y">ANFITRIÓN</span>' : ''}</div>`;
    }).join('') : '<div class="vacio">todavía no hay nadie…</div>';
    const puedo = esAnfitrion && lista.length >= 2;
    $('bEmpezar').disabled = !puedo;
    $('bEmpezar').textContent = esAnfitrion ? (puedo ? 'EMPEZAR' : 'FALTAN PILOTOS')
      : 'ESPERANDO AL ANFITRIÓN';
    $('notaEsp').textContent = esAnfitrion
      ? (puedo ? 'Cuando quieras, dale a EMPEZAR' : 'Hacen falta al menos 2 pilotos')
      : 'El anfitrión arranca la partida';
  });
}

/* ===== EL CEREBRO DEL BOT =====
   Cuando le toca a un bot, lo mueve cualquiera que tenga la app abierta (no
   hace falta servidor). El bot usa las MISMAS funciones que tu, asi que no
   puede hacer trampas: juega con las reglas de todos. */
/* ===== MI AVISO DE DESCONEXION =====
   Firebase puede borrarte de la sala cuando sales de la pagina. Lo guardo en
   esta variable para poder CANCELARLO en cuanto la partida empieza: asi puedes
   salir a contestar un mensaje sin que te boten de la mesa. */
let miDesconexion = null;
function registraDesconexion(cod, id){

    miDesconexion = onDisconnect(ref(db,'extreme/salas/'+cod+'/jugadores/'+id));
    miDesconexion.remove();
  } catch(e){}

let botOcupado = false;
function esElBot(s){ return !!(s && s.jugadores && (s.jugadores[s.turno] || {}).esBot); }

/* cuanto vale cada cruce: la suma de los pips de los terrenos que toca */
function valorDelCruce(k){
  let v = 0;
  Object.entries(A).forEach(([kk, x]) => {
    if (!kk.split('|').some(e => e.replace(/^a#/, 'v#') === k)) return;
    const h = HEXES[x.hex];
    if (!h || !h.num) return;
    v += PIPS[h.num] || 0;
    if (OUTPOSTS.some(o => o.k === k)) v += 2;      /* un outpost suma */
  });
  return v;
}

async function mueveElBot(s){
  window.__t = window.__t || [];
  const T = m => { try { window.__t.push(m); if (window.__t.length > 40) window.__t.shift(); } catch(e){} };
  T('IN bOc=' + botOcupado + ' esBot=' + esElBot(s) + ' fase=' + (s && s.fase));
  if (!s || botOcupado || !esElBot(s)){ T('OUT pronto'); return; }
  botOcupado = true;
  const yoReal = yo;
  const botId = s.turno;
  yo = { id: botId, nombre: s.jugadores[botId].nombre, color: s.jugadores[botId].color };
  try {
    await new Promise(r => setTimeout(r, 900 + Math.random()*1100));  /* piensa un poco */
    const s2 = await leerSala(salaCod);
    T('leido fase=' + s2.fase + ' dados=' + (s2.dados ? s2.dados.total : 'no'));
    if (!s2 || s2.turno !== botId){ T('OUT otro se adelanto'); return; }

    /* --- COLOCANDO --- */
    if (s2.fase === 'colocando'){
      const modo = s2.colocPaso || 'base';
      const P = s2.piezas || {};
      const TODAS = [];
      Object.values(P).forEach(pp => {
        (pp.base||[]).forEach(x => TODAS.push({ t:'base', k:x.k }));
        (pp.hub ||[]).forEach(x => TODAS.push({ t:'hub',  k:x.k }));
        (pp.camino||[]).forEach(x => TODAS.push({ t:'camino', k:x.k }));
      });
      const camps = TODAS.filter(x => x.t==='base'||x.t==='hub').map(x => x.k);
      const vecinos = {};
      Object.keys(A).forEach(kk => {
        const p = kk.split('|');
        const v1 = p[0].replace(/^a#/,'v#'), v2 = p[1].replace(/^a#/,'v#');
        (vecinos[v1]=vecinos[v1]||[]).push(v2); (vecinos[v2]=vecinos[v2]||[]).push(v1);
      });
      if (modo === 'base'){
        const libres = Object.keys(V).filter(k => V[k].n >= 2
          && !camps.includes(k)
          && !(vecinos[k]||[]).some(v => camps.includes(v)));
        if (!libres.length) return;
        libres.sort((a,b) => valorDelCruce(b) - valorDelCruce(a));
        const elegido = libres[0];
        await coloca('base', elegido, V[elegido].hex);
      } else {
        const mios = (P[botId]||{});
        const puntos = [
          ...(mios.base||[]).map(b=>b.k), ...(mios.hub||[]).map(b=>b.k),
          ...(mios.camino||[]).flatMap(r => r.k.split('|').map(e => e.replace(/^a#/,'v#')))
        ];
        const validas = Object.entries(A).filter(([kk]) =>
          kk.split('|').some(e => puntos.includes(e.replace(/^a#/,'v#'))));
        if (!validas.length) return;
        /* prefiere la arista que da mas recursos */
        validas.sort((a,b) => valorDelCruce(a[0].split('|')[0].replace(/^a#/,'v#'))
                            - valorDelCruce(b[0].split('|')[0].replace(/^a#/,'v#')));
        const [kk, x] = validas[0];
        await coloca('camino', kk, x.hex);
      }
      return;
    }

    /* --- YA JUGANDO --- */
    if (!s2.dados){
      await tirarDados();                              /* tira (aunque su boton este apagado) */
      return;
    }
    /* intenta construir algo, y si no, pasa */
    T('V=' + Object.keys(V).length + ' A=' + Object.keys(A).length);
    const mis = (s2.recursos && s2.recursos[botId]) || {};
    const hay = (c, n) => (mis[c]||0) >= n;
    const mios = (s2.piezas && s2.piezas[botId]) || {};
    if (hay('flight',1) && hay('ride',1) && hay('board',1) && hay('climb',1)){
      /* Basecamp: en el mejor cruce libre que pegue a algo suyo */
      const camps = [];
      Object.values(s2.piezas||{}).forEach(pp => (pp.base||[]).forEach(x => camps.push(x.k)));
      const puntos = [...(mios.base||[]).map(b=>b.k), ...(mios.camino||[]).flatMap(r => r.k.split('|').map(e=>e.replace(/^a#/,'v#')))];
      const vecinos = {};
      Object.keys(A).forEach(kk => { const p = kk.split('|');
        const v1=p[0].replace(/^a#/,'v#'), v2=p[1].replace(/^a#/,'v#');
        (vecinos[v1]=vecinos[v1]||[]).push(v2); (vecinos[v2]=vecinos[v2]||[]).push(v1); });
      const sitios = Object.keys(V).filter(k => V[k].n>=2 && !camps.includes(k)
        && !(vecinos[k]||[]).some(v => camps.includes(v))
        && puntos.includes(k));
      T('sitios=' + sitios.length);
      if (sitios.length){
        sitios.sort((a,b) => valorDelCruce(b) - valorDelCruce(a));
        T('CONSTRUYE base ' + sitios[0]);
        await coloca('base', sitios[0], V[sitios[0]].hex);
        return;
      }
    }
    if (hay('flight',1) && hay('ride',1)){
      const puntos = [...(mios.base||[]).map(b=>b.k), ...(mios.camino||[]).flatMap(r => r.k.split('|').map(e=>e.replace(/^a#/,'v#')))];
      const validas = Object.entries(A).filter(([kk]) => kk.split('|').some(e => puntos.includes(e.replace(/^a#/,'v#'))));
      T('rutas=' + validas.length);
      if (validas.length){ await coloca('camino', validas[0][0], validas[0][1].hex); return; }
    }
    T('PASA TURNO');
    await pasarTurno();                                /* si no puede, pasa */
  } finally {
    T('FINALLY'); 
    yo = yoReal; botOcupado = false;
    /* ===== REPINTO COMO YO =====
       Mientras el bot jugaba, la pantalla se pudo pintar con SU identidad.
       Aqui la repinto con la tuya, y de paso miro si el bot tiene que seguir
       (el aviso del servidor llego mientras pensaba y se perdio). */
    setTimeout(() => leerSala(salaCod).then(x => {
      if (!x) return;
      pintaBarra(x);
      pintaPartida(x);
      mueveElBot(x);
    }), 600);
  }
}

/* ==========================================================================
   FASE 2 — EL TABLERO COMPARTIDO
   Los mismos 19 hexagonos para todos. Las TARJETAS de los 7 hexagonos de
   arriba son las de Pam; los demas usan su color.
   ========================================================================== */

/* las 6 ilustraciones de terreno (los hexagonos de Pam) */
const FOTOS = {
  flight:'arte/hex_cordillera.png', board:'arte/hex_costa.png',
  ride:'arte/hex_laderas.png',     climb:'arte/hex_pared.png',
  jump:'arte/hex_cumbres.png',     nofly:'arte/hex_nofly.png',
};
const DIBU = { flight:'#7c4ddb', board:'#0e8ba8', ride:'#4f8f1e',
               climb:'#c1741a', jump:'#c73b34', nofly:'#5f584e' };
const TERR = { flight:'Cordillera', board:'Costa y nieve', ride:'Laderas',
               climb:'Paredes', jump:'Cumbres', nofly:'Día sin vuelo' };
/* mazo del tablero base: 19 hexagonos */
const MAZO = [...Array(4).fill('flight'), ...Array(4).fill('board'), ...Array(4).fill('climb'),
              ...Array(3).fill('ride'), ...Array(3).fill('jump'), 'nofly'];
/* mazo del 5-6: 30 hexagonos, con 2 dias sin vuelo */
const MAZO_56 = [...Array(6).fill('flight'), ...Array(6).fill('board'), ...Array(6).fill('climb'),
                 ...Array(5).fill('ride'), ...Array(5).fill('jump'), 'nofly', 'nofly'];
/* los discos de numero del 5-6: 28 (30 menos los 2 dias sin vuelo) */
const NUMS_56 = [2,3,3,4,4,4,5,5,5,6,6,6,8,8,8,9,9,9,10,10,10,11,11,11,4,5,9,10];
const NUMS = [2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
const PIPS = {2:1,3:2,4:3,5:4,6:5,8:5,9:4,10:3,11:2,12:1};
/* ===== LAS DOS FORMAS DE TABLERO =====
   Base (2-4 jug):  3-4-5-4-3 = 19 hexagonos
   5-6 jug:         3-4-5-6-5-4-3 = 30 hexagonos (la "extension" de Catan) */
let COLS = [3,4,5,4,3];
const COLS_56 = [3,4,5,6,5,4,3];   /* 4 lados de 4 + 2 de 3 */
function ponTablero(nJug){ COLS = (nJug >= 5) ? COLS_56.slice() : [3,4,5,4,3]; return COLS; }
/* ===== GEOMETRIA DEL PANAL — la MISMA que el tablero que funciona =====
   (columnas a 1.5R, filas a raiz(3)*R, hexagonos de punta a 60 grados) */
const R = 46, RX = 1.5*R, RY = Math.sqrt(3)*R;
let CX = 233, CY = 250;
/* El lienzo se ajusta a la forma del tablero (19 o 30 hexagonos): asi la isla
   entra entera y no se deforma. Lo llama pintaTablero cada vez. */
function ajustaLienzo(){
  const nCols = COLS.length, nFilas = Math.max.apply(null, COLS);
  const ancho = (nCols-1)*RX + 2*R;
  /* el alto: la columna mas alta, con medio hexagono de aire arriba y abajo */
  const alto  = (nFilas-1)*RY + Math.sqrt(3)*R;
  CX = ancho/2;
  CY = alto/2;
  const svg = $('tablero');
  if (svg) svg.setAttribute('viewBox', '0 0 ' + ancho.toFixed(0) + ' ' + alto.toFixed(0));
}

function revuelve(a){
  const r = a.slice();
  for (let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function pathHex(cx, cy){
  const p = [];
  /* igual que el tablero que funciona: vertices a 0, 60, 120... */
  for (let i=0;i<6;i++){ const a=Math.PI/180*(60*i); p.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]); }
  return p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')+' Z';
}
/* el tablero se genera UNA vez (el anfitrion) y se guarda en la sala:
   asi los dos ven exactamente el mismo mundo. */
function crearTablero(nJug){
  ponTablero(nJug || 2);
  const grande = (nJug >= 5);
  const mazo = revuelve(grande ? MAZO_56 : MAZO);
  const nums = revuelve(grande ? NUMS_56 : NUMS);
  const hs = []; let k=0, ni=0;
  COLS.forEach((cuantos,c) => {
    for (let i=0;i<cuantos;i++){
      const rec = mazo[k++];
      hs.push({ c, i, rec, num: rec==='nofly'?null:nums[ni++] });
    }
  });
  return hs;
}

function pintaTablero(hexes){
  HEXES = hexes;      /* el bot los necesita para valorar los sitios */
  const svg = $('tablero');
  if (!svg) return;
  /* la forma del tablero depende de cuantos hexagonos haya: 19 o 30 */
  ponTablero(hexes.length > 19 ? 5 : 2);
  ajustaLienzo();
  /* OJO: pintaTablero COLOCA cada hexagono con posHex(), que lee POS. Si no
     lo calculo aqui, POS esta vacio y revienta con "Cannot destructure
     property 'cx' of posHex(...)". Y al reventar se corta el aviso entero:
     el tablero no se pinta, no sale el turno y los bots no juegan. */
  calculaPosiciones();
  /* los cruces del panal: hacen falta para colocar los outposts */
  if (!Object.keys(V).length || !V_OUT){
    V = {}; A = {};
    hexes.forEach((hh, idx) => {
      const { cx, cy } = posHex(hh.c, hh.i);
      const pts = [];
      for (let i=0;i<6;i++){ const a=Math.PI/180*(60*i); pts.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]); }
      pts.forEach(p => {
        const k = `v#${p[0].toFixed(1)}#${p[1].toFixed(1)}`;
        if (!V[k]) V[k] = { x:p[0], y:p[1], n:0, hex:idx };
        V[k].n++;
      });
      for (let i=0;i<6;i++){
        const a = pts[i], b = pts[(i+1)%6];
        const k = `a#${a[0].toFixed(1)}#${a[1].toFixed(1)}|a#${b[0].toFixed(1)}#${b[1].toFixed(1)}`;
        if (!A[k]) A[k] = { a, b, hex: idx };
      }
    });
    V_OUT = true;
    ponOutposts();
  }
  /* flat-top: el ancho es raiz(3)*R y el alto 2R. Los tenia al reves. */
  const HX = 2*R, HY = Math.sqrt(3)*R;

  const ROSA_TAB = `<g opacity="0.13" fill="none" stroke="#e8c87a" stroke-width="1.2">
    <circle cx="${CX}" cy="${CY}" r="215"/><circle cx="${CX}" cy="${CY}" r="185" stroke-width=".8"/>
    <circle cx="${CX}" cy="${CY}" r="120" stroke-width=".8"/>
    <path d="M${CX} ${CY-230} L${CX+12} ${CY-8} L${CX+230} ${CY} L${CX+12} ${CY+8} L${CX} ${CY+230}
             L${CX-12} ${CY+8} L${CX-230} ${CY} L${CX-12} ${CY-8} Z"/>
    <path d="M${CX-150} ${CY-150} L${CX-14} ${CY-14} M${CX+150} ${CY-150} L${CX+14} ${CY-14}
             M${CX+150} ${CY+150} L${CX+14} ${CY+14} M${CX-150} ${CY+150} L${CX-14} ${CY+14}"/>
  </g>`;

  let h = ROSA_TAB;
  const lista = [];
  let k = 0;
  COLS.forEach((cuantos,c) => {
    const cx = CX + (c - (COLS.length-1)/2)*RX, y0 = CY - ((cuantos-1)*RY)/2;
    for (let i=0;i<cuantos;i++){
      const rec = hexes[k].rec, num = hexes[k].num, id = 'c'+c+'_'+i;
      lista.push({ cx, cy: y0+i*RY, rec, num, id }); k++;
    }
  });
  lista.forEach(x => { h += `<clipPath id="c${x.id}"><path d="${pathHex(x.cx,x.cy)}"/></clipPath>`; });
  lista.forEach(x => {
    h += `<g class="hex${x.rec==='nofly'?' nofly':''}" data-r="${x.rec}" data-n="${x.num||''}">`;
    h += `<image href="${FOTOS[x.rec]}" x="${(x.cx-HX/2).toFixed(1)}" y="${(x.cy-HY/2).toFixed(1)}"
           width="${HX.toFixed(1)}" height="${HY.toFixed(1)}" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#c${x.id})"/>`;
    /* la junta: ahora DORADA y fina, como en el tablero de Pam. Ya no es un borde negro. */
    h += `<path d="${pathHex(x.cx,x.cy)}" fill="none" stroke="#1a1009" stroke-width="2.2" stroke-linejoin="round"/>`;
    if (x.num){
      /* el numero, en la esquina de arriba a la derecha, con sus puntitos debajo */
      const nx = x.cx + R*0.52, ny = x.cy - R*0.34;
      const color = (x.num===6||x.num===8) ? '#ff6b60' : '#fff';
      h += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
             style="font-family:Anton,sans-serif;font-size:19px;paint-order:stroke;stroke:#1a1009;
             stroke-width:3.2px;stroke-linejoin:round" fill="${color}">${x.num}</text>`;
      const p = PIPS[x.num], sep = 3.7, x0 = nx - ((p-1)*sep)/2;
      for (let i=0;i<p;i++) h += `<circle cx="${(x0+i*sep).toFixed(1)}" cy="${(ny+12.5).toFixed(1)}" r="1.5"
        fill="#fff" stroke="#1a1009" stroke-width="1"/>`;
    }
    h += '</g>';
  });

  svg.innerHTML = h;
  svg.querySelectorAll('.hex').forEach(g => g.onclick = () => {
    const r = g.dataset.r, n = g.dataset.n;
    const p = n ? (PIPS[+n]/36*100).toFixed(1) : null;
    $('info').innerHTML = `<b>${TERR[r]}</b>${n ? ' · ' + n : ''}<br>` +
      (p ? `produce el <b>${p}%</b> de las veces` : 'no produce nunca — aquí vive el Mal Tiempo');
  });
}

/* la barra de pilotos, con el que tiene el turno encendido */
function pintaBarra(s){
  const lista = Object.entries(s.jugadores || {}).map(([id,j]) => ({ id, ...j }));
  const el = $('barra');
  if (!el) return;
  /* el numero de orden: asi se sabe quien es el 1, el 2, el 3… y se juega justo */
  const ordenJuego = (s.orden && s.orden.length) ? s.orden : Object.keys(s.jugadores || {});
  el.innerHTML = lista.map(j => {
    const col = COLORES.find(c => c.id === j.color) || COLORES[0];
    const act = (j.id === s.turno) ? ' act' : '';
    const pa = (s.pa && s.pa[j.id]) || 0;
    const vuelta = s.fase === 'colocando';
    const n = vuelta
      ? ((ordenJuego.indexOf(j.id) % (lista.length || 1)) + 1)
      : (lista.findIndex(x => x.id === j.id) + 1);
    return `<span class="j${act}" title="${vuelta ? 'turno de colocación' : 'orden de juego'} ${n}">
      <span class="ord">${n}</span><img src="${col.img}" alt="">${(j.nombre||'').replace(/[<>]/g,'')}
      ${pa ? '<b style="color:#f0d899">'+pa+'</b>' : ''}</span>`;
  }).join('');
  const t = lista.find(j => j.id === s.turno);
  const mio = (s.turno === yo.id);

  /* ===== LOS DADOS, A LA VISTA DE TODOS ===== */
  const dz = $('dadosVista');
  if (dz){
    if (s.dados){
      const d1 = s.dados.d1, d2 = s.dados.d2, tot = s.dados.total;
      const pips = (n) => { const L = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
        return (L[n]||[]).map(p => `<i style="grid-area:${Math.floor(p/3)+1}/${p%3+1}"></i>`).join(''); };
      const quien = (lista.find(j=>j.id===s.turno)||{}).nombre || '';
      dz.innerHTML = `<span class="dd">${pips(d1)}</span><span class="dd">${pips(d2)}</span>
        <span class="dtot">${tot}</span><span class="dq">${quien}</span>`;
      dz.classList.add('on');
    } else dz.classList.remove('on');
  }

  /* ===== LA COLOCACION INICIAL ===== */
  if (s.fase === 'colocando'){
    const paso = (s.turno === yo.id) ? (s.colocPaso || 'base') : null;
    const cuantos = (s.colocadoEn || 0), total = (s.orden || []).length * 2;
    $('turnoTxt').innerHTML = mio
      ? `COLOCANDO (${cuantos+1}/${total}) — pon tu <b style="color:#f0d899">${paso==='base'?'BASECAMP':'RUTA'}</b>`
      : `Colocando ${t ? t.nombre : ''}…`;
    $('bPasar').disabled = true;
    $('bPasar').textContent = 'COLOCACIÓN INICIAL';
    $('bDados').disabled = true;
    $('bDados').textContent = '🎲 EMPIEZA DESPUÉS';
    ['bCamino','bBase','bHub','bComercio'].forEach(b => $(b).disabled = true);
    $('bBase').classList.toggle('on',   mio && paso === 'base');
    $('bCamino').classList.toggle('on', mio && paso === 'camino');
    if (mio) $('info').innerHTML = paso === 'base'
      ? 'Toca el tablero donde quieras poner tu <b>Basecamp</b>. Es gratis.'
      : 'Ahora toca una arista que salga de tu <b>Basecamp</b>. También gratis.';
    pintaRecursos(s);
    return;
  }

  $('turnoTxt').textContent = t ? (mio ? 'TU TURNO' : 'Turno de ' + t.nombre) : '';
  $('bPasar').disabled = !mio;
  $('bPasar').textContent = mio ? 'PASAR EL TURNO' : 'ESPERANDO…';
  $('bDados').disabled = !mio || !!s.dados;
  $('bDados').textContent = !mio ? '🎲 ESPERANDO…' : (s.dados ? '🎲 SACASTE ' + s.dados.total : '🎲 TIRAR LOS DADOS');
  ['bCamino','bBase','bHub','bComercio'].forEach(b => $(b).disabled = !mio);
  pintaRecursos(s);
}

/* ===== TUS RECURSOS ===== */
function pintaRecursos(s){
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  $('recursos').innerHTML = RECURSOS.map(c => {
    const cuantos = mis[c.id] || 0;
    return `<span class="cartaRec${cuantos?'':' vacia'}" title="${c.n}">
      <img src="${c.mini}" alt="${c.n}"><b>${cuantos}</b></span>`;
  }).join('');
}

/* ===== LOS COSTES (los mismos que el reglamento) ===== */
const COSTES = {
  camino: { flight:1, ride:1 },
  base:   { flight:1, ride:1, board:1, climb:1 },
  hub:    { climb:2, jump:3 },
};
const NOMBRE = { camino:'Ruta', base:'Basecamp', hub:'Adventure Hub' };

function alcanza(mis, coste){
  return Object.entries(coste).every(([k,v]) => (mis[k]||0) >= v);
}
function cobra(mis, coste){
  const out = Object.assign({}, mis);
  Object.entries(coste).forEach(([k,v]) => out[k] = (out[k]||0) - v);
  return out;
}
function textoCoste(coste){
  return Object.entries(coste).map(([k,v]) => `${v} ${k.toUpperCase()}`).join(' + ');
}

/* ===== EL AVISO (para que se vea lo que pasa) ===== */
let avisoTimer = null;
function aviso(titulo, texto, ms){
  $('avisoTx').innerHTML = `<b>${titulo}</b>${texto}`;
  $('aviso').classList.add('on');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(() => $('aviso').classList.remove('on'), ms || 2600);
}
$('aviso').onclick = () => $('aviso').classList.remove('on');

/* ===== TIRAR LOS DADOS Y COBRAR ===== */
async function tirarDados(){
  const s = await leerSala(salaCod);
  if (!s || s.turno !== yo.id || s.dados) return;
  const d1 = 1 + Math.floor(Math.random()*6), d2 = 1 + Math.floor(Math.random()*6);
  const total = d1 + d2;
  const rec = Object.assign({}, s.recursos || {});
  const gano = {};
  if (s.hexes){
    s.hexes.forEach((h, idx) => {
      if (h.num !== total) return;
      /* quien tenga un Basecamp (1) o Hub (2) pegado a este hexagono, cobra */
      Object.entries(s.jugadores || {}).forEach(([id]) => {
        const toca = tocaHex(s.piezas && s.piezas[id], idx);
        if (toca > 0){
          rec[id] = rec[id] || {};
          rec[id][h.rec] = (rec[id][h.rec] || 0) + toca;
          gano[id] = gano[id] || {};
          gano[id][h.rec] = (gano[id][h.rec] || 0) + toca;
        }
      });
    });
  }
  await update(ref(db,'extreme/salas/'+salaCod), { dados: { d1, d2, total }, recursos: rec });
  const quien = Object.keys(gano).length
    ? Object.entries(gano).map(([id,g]) => {
        const j = (s.jugadores||{})[id] || {};
        return (j.nombre||'?') + ': ' + Object.entries(g).map(([k,v]) => v+' '+k.toUpperCase()).join(', ');
      }).join('  ·  ')
    : 'nadie tiene nada pegado al ' + total;
  aviso('🎲 ' + d1 + ' + ' + d2 + ' = ' + total, quien, 3200);
}
/* El boton usa la MISMA funcion. Asi el BOT puede tirar sin depender del boton:
   los botones se apagan cuando no es tu turno, y el bot juega "de tapadillo". */
$('bDados').onclick = tirarDados;

/* ===== CONSTRUIR: eliges que, y tocas el tablero ===== */
let modo = null;   // 'camino' | 'base' | 'hub' | null
async function ponModo(m){
  modo = (modo === m) ? null : m;
  ['bCamino','bBase','bHub'].forEach(b => $(b).classList.remove('on'));
  if (modo){
    $('b' + modo.charAt(0).toUpperCase() + modo.slice(1)).classList.add('on');
    const c = COSTES[modo];
    $('info').innerHTML = `<b>${NOMBRE[modo]}</b> — toca el tablero donde quieras ponerla<br>
      cuesta ${textoCoste(c)}`;
  } else $('info').innerHTML = '';
  /* REPINTAR: al cambiar el modo hay que volver a pintar, o los puntos
     donde SI puedes poner no aparecen hasta el siguiente aviso del servidor. */
  const s = await leerSala(salaCod);
  if (s) pintaPartida(s);
}
$('bCamino').onclick = () => ponModo('camino');
$('bBase').onclick   = () => ponModo('base');
$('bHub').onclick    = () => ponModo('hub');

/* coloca la pieza en el vertice (basecamp/hub) o en la arista (ruta) que toques */
async function coloca(tipo, clave, hexIdx){
  const s = await leerSala(salaCod);
  if (!s || s.turno !== yo.id) return;

  /* ===== SI ESTAMOS COLOCANDO, LAS PIEZAS SON GRATIS y hay que ir en orden ===== */
  if (s.fase === 'colocando'){
    if (s.colocPaso && s.colocPaso !== tipo){
      aviso('Primero ' + NOMBRE[s.colocPaso].toLowerCase(),
            `Toca poner <b>${NOMBRE[s.colocPaso]}</b> antes.`); return;
    }
    const piezas = JSON.parse(JSON.stringify(s.piezas || {}));
    /* OJO: si ya tienes una pieza, piezas[yo.id] YA EXISTE y no trae las tres
       listas. Hay que asegurarlas una a una, o .camino queda undefined y
       revienta al poner la Ruta. */
    piezas[yo.id] = piezas[yo.id] || {};
    piezas[yo.id].base   = piezas[yo.id].base   || [];
    piezas[yo.id].hub    = piezas[yo.id].hub    || [];
    piezas[yo.id].camino = piezas[yo.id].camino || [];
    const lista = tipo === 'camino' ? piezas[yo.id].camino : piezas[yo.id][tipo];
    if (lista.some(p => p.k === clave)){ aviso('Ya hay algo ahí',''); return; }

    /* ===== EN LA COLOCACION CADA UNO PONE DOS =====
       Un Basecamp en la ida y otro en la vuelta (con una Ruta cada uno).
       Sin este tope, si el orden se descuadraba alguien acababa con TRES
       Basecamps y los demas con uno. */
    if (tipo === 'base' && piezas[yo.id].base.length >= 2){
      aviso('Ya tienes tus 2 Basecamps',
            'Se pone uno, y el segundo cuando vuelva tu turno. Ahora toca esperar.'); return;
    }
    if (tipo === 'camino' && piezas[yo.id].camino.length >= 2){
      aviso('Ya tienes tus 2 Rutas',
            'Cada Basecamp lleva una Ruta. Ya pusiste las dos de la colocación inicial.'); return;
    }

    if (tipo === 'base'){
      const hayAlgo = Object.values(piezas).some(p =>
        [...(p.base||[]), ...(p.hub||[])].some(x => x.k === clave));
      if (hayAlgo){ aviso('Ahí ya hay una pieza',''); return; }
      /* en la ida no hace falta tocar ruta; en la vuelta, el Basecamp ya no tiene que tocar nada */
      piezas[yo.id].base.push({ k: clave, hex: hexIdx });
    } else {
      /* la Ruta tiene que salir de tu Basecamp recien puesto */
      /* La Ruta puede salir de CUALQUIERA de tus Basecamps, o seguir
         CUALQUIERA de tus rutas. Antes solo valia el ULTIMO Basecamp que
         pusiste: en la segunda vuelta, o cuando ya tienes rutas por el
         tablero, te decia "pega la ruta a tu basecamp" y no te dejaba seguir. */
      const misPuntos = [
        ...(piezas[yo.id].base  ||[]).map(b => b.k),
        ...(piezas[yo.id].hub   ||[]).map(b => b.k),
        ...(piezas[yo.id].camino||[]).flatMap(r => r.k.split('|').map(e => e.replace(/^a#/, 'v#')))
      ];
      const toca = clave.split('|').some(ar => misPuntos.includes(ar.replace(/^a#/, 'v#')));
      if (!toca){
        aviso('Pega la Ruta a algo tuyo','La Ruta tiene que salir de un Basecamp tuyo o seguir una ruta tuya.');
        return;
      }
      piezas[yo.id].camino.push({ k: clave, hex: hexIdx, v: clave.split('|') });
    }

    /* avanza el orden de colocacion */
    const orden = s.orden || [];
    const n = (s.colocadoEn || 0) + 1;
    /* ===== EL QUE COBRA ES EL **SEGUNDO** BASECAMP =====
       Antes esto dependia del contador de piezas: si el orden salia descuadrado,
       alguien ponia su 2o Basecamp en la ida y NO COBRABA NADA (nos paso en la
       partida AUSQ: Eri con 2 camps y cero recursos). Ahora se mira lo que el
       jugador TIENE de verdad: si este es su segundo Basecamp, cobra. */
    const vuelta = ((piezas[yo.id].base||[]).length === 2) || (n >= orden.length);
    const upd = { piezas };
    if (tipo === 'base' && vuelta){
      /* el SEGUNDO Basecamp YA COBRA: es la produccion inicial de Catan */
      const rec = Object.assign({}, s.recursos || {});
      rec[yo.id] = Object.assign({}, rec[yo.id] || {});
      (s.hexes||[]).forEach((h, i) => {
        if (!h.num) return;
        const toca = tocaHex(piezas[yo.id], i);
        if (toca > 0) rec[yo.id][h.rec] = (rec[yo.id][h.rec]||0) + toca;
      });
      upd.recursos = rec;
      const gano = Object.entries(rec[yo.id]).filter(([,v]) => v>0)
        .map(([k,v]) => v + ' ' + k.toUpperCase()).join(' · ');
      aviso('🎁 Producción inicial', gano || 'ese rincón no produce');
    }
    /* cada Basecamp vale 1 Punto de Aventura — TAMBIEN en la colocacion inicial */
    if (tipo === 'base'){
      const pa = Object.assign({}, s.pa || {});
      pa[yo.id] = (pa[yo.id] || 0) + 1;
      upd.pa = pa;
    }
    upd.colocadoEn = n;
    upd.colocPaso = (tipo === 'base') ? 'camino' : null;
    if (n >= orden.length * 2){
      /* todos han puesto sus dos piezas: EMPIEZA LA PARTIDA */
      upd.fase = 'juego'; upd.turno = (s.anfitrion || orden[0]); upd.colocPaso = null;
    } else {
      /* OJO: cada jugador pone DOS piezas (camp y ruta), y "n" cuenta PIEZAS.
         Por eso hay que dividir entre 2 para saber a quien le toca. Si no, se
         saltaba jugadores: iba J1, J3, J5, J6, J4, J2… */
      if (!upd.colocPaso) upd.turno = orden[Math.floor(n/2) % orden.length];
    }
    await update(ref(db,'extreme/salas/'+salaCod), upd);
    if (tipo === 'base') aviso('✔ Basecamp puesto', 'Ahora toca una <b>RUTA</b> que salga de ahí', 1600);
    return;
  }

  /* ===== YA JUGANDO: se paga ===== */
  const mis = (s.recursos && s.recursos[yo.id]) || {};
  const coste = COSTES[tipo];
  if (!alcanza(mis, coste)){
    aviso('No te llega', `Necesitas <b>${textoCoste(coste)}</b><br>y tienes: ${
      Object.entries(mis).filter(([,v])=>v>0).map(([k,v])=>v+' '+k.toUpperCase()).join(' + ') || 'nada'}`);
    return;
  }
  const piezas = JSON.parse(JSON.stringify(s.piezas || {}));
  /* OJO: si ya tienes una pieza, piezas[yo.id] YA EXISTE y no trae las tres
       listas. Hay que asegurarlas una a una, o .camino queda undefined y
       revienta al poner la Ruta. */
    piezas[yo.id] = piezas[yo.id] || {};
    piezas[yo.id].base   = piezas[yo.id].base   || [];
    piezas[yo.id].hub    = piezas[yo.id].hub    || [];
    piezas[yo.id].camino = piezas[yo.id].camino || [];
  const lista = tipo === 'camino' ? piezas[yo.id].camino : piezas[yo.id][tipo];
  if (lista.some(p => p.k === clave)){ aviso('Ya hay algo ahí',''); return; }

  if (tipo === 'base'){
    if (piezas[yo.id].base.length + piezas[yo.id].hub.length >= 5){
      aviso('Sin piezas', 'Ya tienes 5 Basecamps y Hubs (el máximo). Súbelos a Hub.'); return;
    }
    /* tiene que tocar una de tus rutas (o ser el primero) */
    /* vale si la ruta sale de tu Basecamp o sigue otra ruta tuya */
    const misPuntos2 = [
      ...(piezas[yo.id].base  ||[]).map(b => b.k),
      ...(piezas[yo.id].hub   ||[]).map(b => b.k),
      ...(piezas[yo.id].camino||[]).flatMap(r => r.k.split('|').map(e => e.replace(/^a#/, 'v#')))
    ];
    const toca = clave.split('|').some(ar => misPuntos2.includes(ar.replace(/^a#/, 'v#')));
    const hayAlgo = Object.values(piezas).some(p => [...(p.base||[]), ...(p.hub||[])].some(x => x.k === clave));
    if (hayAlgo){ aviso('Ya hay una pieza ahí',''); return; }
    if (!toca && rutas.length){ aviso('Lejos', 'Un Basecamp tiene que tocar una de tus rutas.'); return; }
    lista.push({ k: clave, hex: hexIdx });
  } else if (tipo === 'hub'){
    const mio = [...(piezas[yo.id].base||[]), ...(piezas[yo.id].hub||[])].find(x => x.k === clave);
    if (!mio){ aviso('No es tuyo', 'Solo puedes subir a Hub un Basecamp tuyo.'); return; }
    piezas[yo.id].base = piezas[yo.id].base.filter(x => x.k !== clave);
    piezas[yo.id].hub.push({ k: clave, hex: mio.hex });
  } else {
    lista.push({ k: clave, hex: hexIdx, v: clave.split('|') });
  }
  const rec = Object.assign({}, s.recursos || {});
  rec[yo.id] = cobra(mis, coste);
  const pa = Object.assign({}, s.pa || {});
  if (tipo === 'base') pa[yo.id] = (pa[yo.id]||0) + 1;
  if (tipo === 'hub')  pa[yo.id] = (pa[yo.id]||0) + 1;
  await update(ref(db,'extreme/salas/'+salaCod), { piezas, recursos: rec, pa });
  ponModo(null);
  aviso('✔ ' + NOMBRE[tipo] + ' puesto', 'Gastaste ' + textoCoste(coste));
}

/* ===== VOLVER A PINTAR: recursos, dados y piezas encima del tablero ===== */
function pintaPartida(s){
  pintaBarra(s);
  pintaRecursos(s);
  pintaOfertas(s);
  const svg = $('tablero');
  if (!svg) return;
  /* quito las capas de piezas y las vuelvo a poner */
  svg.querySelectorAll('.capaPiezas,.capaTocar').forEach(n => n.remove());
  const P = s.piezas || {};
  let h = '<g class="capaPiezas">';
  Object.entries(P).forEach(([id, pp]) => {
    const col = COLORES.find(c => c.id === ((s.jugadores||{})[id]||{}).color) || COLORES[0];
    (pp.camino||[]).forEach(r => {
      const v = r.v || r.k.split('|');
      h += `<line x1="${v[0].split('#')[1]}" y1="${v[0].split('#')[2]}" x2="${v[1].split('#')[1]}"
             y2="${v[1].split('#')[2]}" stroke="${col.c}" stroke-width="8" stroke-linecap="round"
             opacity=".92" stroke-dasharray="1000" stroke-dashoffset="0"/>`;
    });
    (pp.base||[]).forEach(b => {
      const [x,y] = b.k.split('#').slice(1);
      h += `<circle cx="${x}" cy="${y}" r="8" fill="${col.c}" stroke="#1a1009" stroke-width="2.4"/>`;
    });
    (pp.hub||[]).forEach(b => {
      const [x,y] = b.k.split('#').slice(1);
      h += `<circle cx="${x}" cy="${y}" r="11" fill="${col.c}" stroke="#f0d899" stroke-width="2.6"/>`;
    });
  });
  h += '</g>';
  /* capa de puntos para TOCAR (solo visible cuando estas construyendo) */
  if (modo && s.turno === yo.id){
    h += '<g class="capaTocar">';
    V = {}; A = {};
    (s.hexes||[]).forEach((hh, idx) => {
      const { cx, cy } = posHex(hh.c, hh.i);
      const pts = [];
      for (let i=0;i<6;i++){
        const a = Math.PI/180*(60*i);
        pts.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]);
      }
      pts.forEach((p,i) => {
        const k = `v#${p[0].toFixed(1)}#${p[1].toFixed(1)}`;
        if (!V[k]) V[k] = { x:p[0], y:p[1], n:0, hex:idx };
        V[k].n++;
      });
      for (let i=0;i<6;i++){
        const a = pts[i], b = pts[(i+1)%6];
        /* el MISMO formato que usa el dibujo: a#x1#y1|a#x2#y2 (sin comas) */
        const k = `a#${a[0].toFixed(1)}#${a[1].toFixed(1)}|a#${b[0].toFixed(1)}#${b[1].toFixed(1)}`;
        if (!A[k]) A[k] = { a, b, hex: idx };
      }
    });
    /* ===== LO QUE DE VERDAD PUEDES PONER =====
       Antes se encendia TODO, y no te guiaba. Ahora solo sale en verde lo que
       el reglamento te permite: los caminos que salen de tus Basecamps (o
       siguen tus rutas), y los cruces donde puedes poner un Basecamp. */
    const P = piezasDe(s);
    /* TODAS las piezas de la mesa (mias y de los demas) */
    const TODAS = [];
    Object.values(s.piezas || {}).forEach(pp => {
      (pp.base  ||[]).forEach(x => TODAS.push({ t:'base',  k:x.k }));
      (pp.hub   ||[]).forEach(x => TODAS.push({ t:'hub',   k:x.k }));
      (pp.camino||[]).forEach(x => TODAS.push({ t:'camino', k:x.k }));
    });
    const misBases  = P.filter(x => x.t === 'base' || x.t === 'hub').map(x => x.k);
    const misRutas  = P.filter(x => x.t === 'camino').map(x => x.k);
    const puntosDeRuta = misRutas.flatMap(rk => rk.split('|'));
    /* un cruce vale si NO tiene una pieza y NO toca el camp de nadie:
       en Catan los campamentos no pueden pegarse unos a otros. */
    const basesDeTodos = TODAS.filter(x => x.t==='base' || x.t==='hub').map(x => x.k);
    /* los vecinos de cada cruce: los que une una arista del tablero */
    const vecinosDe = {};
    Object.keys(A).forEach(kk => {
      const partes = kk.split('|');
      const v1 = partes[0].replace(/^a#/, 'v#'), v2 = partes[1].replace(/^a#/, 'v#');
      (vecinosDe[v1] = vecinosDe[v1] || []).push(v2);
      (vecinosDe[v2] = vecinosDe[v2] || []).push(v1);
    });
    const libres = k => {
      if (TODAS.some(x => (x.t==='base'||x.t==='hub') && x.k === k)) return false;
      /* ningun camp a un cruce de distancia: es la regla de Catan */
      const vec = vecinosDe[k] || [];
      if (vec.some(v => basesDeTodos.includes(v))) return false;
      return true;
    };

    if (modo === 'camino'){
      Object.entries(A).forEach(([kk, x]) => {
        const extremos = kk.split('|');
        /* vale si un extremo es un vertice con TU base o con TU ruta */
        const vale = extremos.some(e => {
          const vk = e.replace(/^a#/, 'v#');
          return misBases.includes(vk) || puntosDeRuta.includes(e);
        });
        if (!vale) return;
        h += `<line class="toque toqCamino" data-t="camino" data-k="${kk}" data-h="${x.hex}"
               x1="${x.a[0]}" y1="${x.a[1]}" x2="${x.b[0]}" y2="${x.b[1]}"
               stroke="#5df08a" stroke-width="12" stroke-linecap="round"
               stroke-dasharray="9 6" style="filter:drop-shadow(0 0 7px #2fd45f)"/>`;
      });
    } else {
      Object.entries(V).forEach(([k, x]) => {
        if (x.n < 2) return;
        if (!libres(k)) return;                    /* ya hay una pieza ahi */
        /* Al CONSTRUIR (ya jugando) el Basecamp tiene que pegarse a algo tuyo.
           Pero en la COLOCACION INICIAL va donde quieras (mientras no toque
           otro camp): si no, en la segunda vuelta te escondia TODOS los cruces
           y parecia que el juego no te dejaba poner nada. */
        if (misRutas.length && s.fase !== 'colocando'){
          const pega = misRutas.some(rk => rk.split('|').some(e => e.replace(/^a#/,'v#') === k));
          if (!pega) return;
        }
        h += `<circle class="toque toqVert" data-t="${modo}" data-k="${k}" data-h="${x.hex}"
               cx="${x.x}" cy="${x.y}" r="13"
               fill="rgba(93,240,138,.55)" stroke="#eafff0" stroke-width="2.5"
               style="filter:drop-shadow(0 0 8px #2fd45f)"/>`;
      });
    }
    h += '</g>';
  }
  h += '<g class="capaOutposts">';
  OUTPOSTS.forEach(o => {
    const col = o.r ? (RECURSOS.find(x => x.id === o.r) || {}) : {};
    h += `<g class="outpost">
      <circle cx="${o.x.toFixed(1)}" cy="${o.y.toFixed(1)}" r="15"
        fill="#2a1d12" stroke="#c9a558" stroke-width="2.2"
        style="filter:drop-shadow(0 2px 5px rgba(0,0,0,.85))"/>
      <text x="${o.x.toFixed(1)}" y="${(o.y-1).toFixed(1)}" text-anchor="middle"
        style="font-family:Anton,sans-serif;font-size:11px;fill:#f0d899">${o.t}</text>
      ${o.r ? `<text x="${o.x.toFixed(1)}" y="${(o.y+9.5).toFixed(1)}" text-anchor="middle"
        style="font-family:Anton,sans-serif;font-size:7.5px;fill:#fff">${(col.n||'').slice(0,4)}</text>` : ''}
    </g>`;
  });
  h += '</g>';
  svg.insertAdjacentHTML('beforeend', h);
  /* UN SOLO manejador para todo el tablero. Asi da igual que sea un circulo o
     una linea, y no importa que el SVG se repinte: siempre funciona. */
  /* ===== TOCAR FACIL =====
     Antes habia que acertarle a una linea fina. Ahora el juego coge la arista
     (o el cruce) MAS CERCANO a donde tocas, como el Catan digital. */
  svg.onclick = (e) => {
    const todos = [...svg.querySelectorAll('.toque')];
    if (!todos.length) return;

    /* 1) lo normal: el toque trae coordenadas -> cojo la arista MAS CERCANA
          (radio generoso, que es un dedo y no un raton) */
    if (e.clientX || e.clientY){
      const pt = svg.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      let p;
      try { p = pt.matrixTransform(svg.getScreenCTM().inverse()); } catch(err){ p = null; }
      if (p){
        let mejor = null, mejorD = Infinity;
        todos.forEach(el => {
          let d;
          if (el.tagName === 'line'){
            d = distPuntoSegmento(p.x, p.y, +el.getAttribute('x1'), +el.getAttribute('y1'),
                                                +el.getAttribute('x2'), +el.getAttribute('y2'));
          } else {
            d = Math.hypot(p.x - +el.getAttribute('cx'), p.y - +el.getAttribute('cy'));
          }
          if (d < mejorD){ mejorD = d; mejor = el; }
        });
        if (mejor && mejorD <= 34){ coloca(mejor.dataset.t, mejor.dataset.k, +mejor.dataset.h); return; }
      }
    }

    /* 2) respaldo: si el navegador no dio coordenadas, uso lo que se toco */
    const el = (e.target && e.target.closest) ? e.target.closest('.toque') : null;
    if (el) coloca(el.dataset.t, el.dataset.k, +el.dataset.h);
  };
}

async function responde(oid, acepta){
  const s = await leerSala(salaCod);

  if (!o) return;
  const ofertas = Object.assign({}, s.ofertas || {});
  if (acepta === null){ delete ofertas[oid]; }
  else if (acepta){
    /* el cambio de verdad */
    const rec = Object.assign({}, s.recursos || {});
    rec[o.de]  = Object.assign({}, rec[o.de]  || {});
    rec[yo.id] = Object.assign({}, rec[yo.id] || {});
    for (const k in o.doy){                     /* de -> yo */
      rec[o.de][k]  = (rec[o.de][k]||0) - o.doy[k];
      rec[yo.id][k] = (rec[yo.id][k]||0) + o.doy[k];
    }
    for (const k in o.pido){                    /* yo -> de */
      rec[yo.id][k] = (rec[yo.id][k]||0) - o.pido[k];
      rec[o.de][k]  = (rec[o.de][k]||0) + o.pido[k];
    }
    delete ofertas[oid];
    await update(ref(db,'extreme/salas/'+salaCod), { recursos: rec, ofertas });
    aviso('✔ Trato hecho', 'Se ha hecho el cambio');
    return;
  } else {
    ofertas[oid].rechazo = (ofertas[oid].rechazo || 0) + 1;
  }
  await update(ref(db,'extreme/salas/'+salaCod), { ofertas });
}
/* distancia de un punto a un segmento: sirve para coger la arista mas cercana */
function distPuntoSegmento(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const L2 = dx*dx + dy*dy;
  if (!L2) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
}

/* ===== LA TASA DE CAMBIO =====
   Sin outpost: 4 por 1. Con un outpost 3:1: 3 por 1. Con el 2:1 de ese
   deporte: 2 por 1. Asi los puertos sirven para algo. */
function tasaDe(s, rid){
  const p = (s.piezas && s.piezas[yo.id]) || {};
  const mios = [...(p.base||[]), ...(p.hub||[])].map(x => x.k);
  let tasa = 4;
  OUTPOSTS.forEach(o => {
    if (!mios.includes(o.k)) return;
    if (o.t === '3:1' && tasa > 3) tasa = 3;
    if (o.t === '2:1' && o.r === rid && tasa > 2) tasa = 2;
  });
  return tasa;
}

function piezasDe(s){

/* ===== LOS OUTPOSTS (los puertos de Catan) =====
   Van en los cruces del BORDE de la isla. 4 son 3:1 (cambias 3 de cualquiera
   por 1) y 5 son 2:1 de un deporte concreto. Si tienes un Basecamp ahi,
   comercias mejor. */
const TIPOS_OUTPOST = [
  { t:'3:1' }, { t:'2:1', r:'flight' }, { t:'3:1' }, { t:'2:1', r:'board' },
  { t:'3:1' }, { t:'2:1', r:'ride' }, { t:'3:1' }, { t:'2:1', r:'climb' },
  { t:'2:1', r:'jump' },
];
let OUTPOSTS = [];      /* [{ k:'v#x#y', x, y, tipo, r }] */
/* el panal: cruces (V) y aristas (A). Son globales porque los usan tanto el
   tablero como los outposts. */
let V = {}, A = {}, V_OUT = false;
let HEXES = [];      /* los hexagonos de la partida: los usa el bot */

/* reparto los 9 outposts por el borde de la isla, bien separados */
function ponOutposts(){
  const borde = [];
  Object.entries(V).forEach(([k, x]) => {
    if (x.n === 2 && !cercaDelCentro(x)) borde.push({ k, x: x.x, y: x.y });
    if (x.n === 1) borde.push({ k, x: x.x, y: x.y });
  });
  /* me quedo con los del perimetro exterior, separados entre si */
  const cx = CX, cy = CY;
  borde.sort((a,b) => Math.atan2(a.y-cy, a.x-cx) - Math.atan2(b.y-cy, b.x-cx));
  const elegidos = [];
  const sep = Math.min(...(COLS.length > 5 ? [70] : [62]));
  borde.forEach(b => {
    if (elegidos.every(e => Math.hypot(e.x-b.x, e.y-b.y) > sep)) elegidos.push(b);
  });
  /* si salen de mas o de menos, me quedo con 9 repartidos */
  const paso = Math.max(1, Math.floor(elegidos.length / 9));
  const nueve = [];
  for (let i=0; i<elegidos.length && nueve.length<9; i+=paso) nueve.push(elegidos[i]);
  OUTPOSTS = nueve.slice(0,9).map((b, i) => Object.assign({}, b, TIPOS_OUTPOST[i % TIPOS_OUTPOST.length]));
  return OUTPOSTS;
}
function cercaDelCentro(x){ return Math.hypot(x.x-CX, x.y-CY) < Math.min(...COLS)*RY*0.42; }

/* la posicion de cada hexagono en el mapa */
const POS = [];
function posHex(c, i){
  return POS[c*10 + i];
}

/* ===== QUE HEXAGONOS TOCA UN CRUCE =====
   Un cruce del panal toca TRES hexagonos (dos, o uno, en el borde de la isla).
   Antes cada Basecamp guardaba UN SOLO hexagono, asi que solo cobraba de ese:
   los otros dos se perdian y por eso "no daba las tarjetas correctas". Aqui se
   calculan de verdad: los hexagonos cuyo centro esta a R del cruce. */
function hexesDelCruce(k){
  const p = String(k).replace(/^v#/, '').split('#').map(Number);
  if (!isFinite(p[0]) || !isFinite(p[1])) return [];
  const out = [];
  HEXES.forEach((h, i) => {
    const pos = posHex(h.c, h.i);
    if (pos && Math.hypot(pos.cx - p[0], pos.cy - p[1]) < R * 1.08) out.push(i);
  });
  return out;
}
/* cuanto te da ese hexagono: Basecamp suma 1, Hub suma 2 (y si tienes dos
   piezas alrededor, suma las dos) */
function tocaHex(pz, i){
  let n = 0;
  ((pz && pz.base) || []).forEach(b => { if (hexesDelCruce(b.k).includes(i)) n += 1; });
  ((pz && pz.hub)  || []).forEach(b => { if (hexesDelCruce(b.k).includes(i)) n += 2; });
  return n;
}
function calculaPosiciones(){
  COLS.forEach((cuantos,c) => {
    const cx = CX + (c - (COLS.length-1)/2)*RX, y0 = CY - ((cuantos-1)*RY)/2;
    for (let i=0;i<cuantos;i++) POS[c*10+i] = { cx, cy: y0+i*RY };
  });
}

      salaCod = qCod; escuchar(qCod);
    } else if (guardado && guardado.nombre){
      /* Tu ficha ya no esta en la sala: el onDisconnect te quita cuando cierras
         la app. Antes te dejaba fuera (portada) y parecia que "no te dejaba
         entrar". Ahora vuelves a entrar solo, con tu mismo nombre. */
      entrarDirecto(qCod, guardado.nombre, null).then(ok => {
        if (ok) return;
        $('inCod').value = qCod; pant('p2');
        if (s){
          const occ = Object.values(s.jugadores||{}).map(j => j.color);
          const e2 = c => { window._c2 = c; pintaAro('aro2', occ, c, e2); };
          pintaAro('aro2', occ, null, e2);
        }
      });
    } else {
      $('inCod').value = qCod; pant('p2');
      if (s){
        const occ = Object.values(s.jugadores||{}).map(j => j.color);
        const e2 = c => { window._c2 = c; pintaAro('aro2', occ, c, e2); };
        pintaAro('aro2', occ, null, e2);
      }
    }
  });
}
/* 3) sin codigo: a la portada */
else {
  const guardado = recuerda();
  if (guardado && guardado.cod){
    leerSala(guardado.cod).then(s => {
      if (s && s.jugadores && s.jugadores[guardado.id]){
        yo = { id: guardado.id, nombre: guardado.nombre, color: s.jugadores[guardado.id].color };
        esAnfitrion = (s.anfitrion === guardado.id);
        salaCod = guardado.cod; escuchar(guardado.cod);
      } else if (s && guardado.nombre){
        /* Ya no estas en la sala (el onDisconnect te quito al cerrar la app).
           Vuelve a entrar solo con tu nombre, en vez de quedarte en la portada. */
        entrarDirecto(guardado.cod, guardado.nombre, null).catch(() => {});
      }
    });
  }
}
